            position: fixed;

        .glass { 
            background: rgba(2, 6, 23, 0.85); 
            border-left: 1px solid rgba(56, 189, 248, 0.2); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px);
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.95);
        }

        .img-glow-transition {
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: filter, transform;
        }

        .custom-hud-scroll::-webkit-scrollbar {
            display: none;
        }
        .custom-hud-scroll {
            -ms-overflow-style: none;  /* IE and Edge */

                    desc: 'INKJET ADH sobre MDF para montajes individuales o mosaicos.', 
                    spec: '(MODELO 1:1) ADQUIERES TU PIEZA Y FINANCIAS OTRA PARA LA COMUNIDAD', 
                    price: '$29USD', 
                    id: 'FP-30X30',
                    img: 'img/surface.png', imgBack: 'img/panel30W.png', imgRaw: 'img/panel30B.png',
                    telemetry: { DIM: '30x30', MEDIA: 'MDF', DIAL_EX: '⧗576', RATE: '$0.05USD' }
                },
                '40X40': { 
                    label: 'PANEL40X40', 
                    desc: 'INKJET ADH sobre MDF para montajes individuales o mosaicos.', 
                    spec: '(MODELO 1:1) ADQUIERES TU PIEZA Y FINANCIAS OTRA PARA LA COMUNIDAD', 
                    price: '$55USD', 
                    id: 'FP-40X40',
                    img: 'img/surface.png', imgBack: 'img/panel40W.png', imgRaw: 'img/panel40B.png',
                    telemetry: { DIM: '40x40', MEDIA: 'MDF', DIAL_EX: '⧗1100', RATE: '$0.05USD' }
                }
            }
        }
    };
    let currentBioItem = 'STENCIL';
    let currentBioVariant = '40X40';
    const numeroCelular = "573025333130";

    // ==========================================
    // 2. CACHÉ DE ELEMENTOS DE UI (OPTIMIZADO)
    // ==========================================
    const $ = (id) => document.getElementById(id);
    const cachedElements = {};
    
    function getCachedEl(id) {
        if (!cachedElements[id]) {
            cachedElements[id] = $(id);
        }
        return cachedElements[id];
    }

    const triggerHaptic = (ms) => { if (navigator.vibrate) navigator.vibrate(ms); };

    // ==========================================
    // 3. SISTEMA DE REVELADO (POINTER EVENTS)
    // ==========================================
// ==========================================
    // 3. MOTOR DE ESTADO VISUAL (Centralizado)
    // ==========================================
    function aplicarModoVisual(modo) {
        const front = getCachedEl('artepanel-pack-img');
        const back = getCachedEl('artepanel-pack-img-back');
        const raw = getCachedEl('artepanel-pack-img-raw');
        const svg = getCachedEl('laser-vector-target');

        // Reset general
        [front, back, raw].forEach(el => { if(el) el.style.opacity = '0'; });
        
        // Aplicar estado
        if (modo === 'front') {
            front.style.opacity = '1';
            front.style.zIndex = '10';
            back.style.zIndex = '0';
            if (svg) { svg.style.opacity = '1'; svg.style.pointerEvents = 'auto'; }
        } else if (modo === 'back') {
            back.style.opacity = '1';
            back.style.zIndex = '10';
            front.style.zIndex = '0';
            if (svg) { svg.style.opacity = '0'; svg.style.pointerEvents = 'none'; }
        } else if (modo === 'raw') {
            raw.style.opacity = '1';
            if (svg) { svg.style.opacity = '0'; svg.style.pointerEvents = 'none'; }
        }
    }

    function vincularBotones() {
        const btnBio = getCachedEl('btn-reveal-bio');
        const btnRaw = getCachedEl('btn-reveal-raw');
        
        // Estado para gestionar el modo actual y permitir el "cierre" al presionar de nuevo
        let modoActual = 'front';

        const alternarModo = (modo, haptic) => {
            if (modoActual === modo) {
                aplicarModoVisual('front');
                modoActual = 'front';
            } else {
                aplicarModoVisual(modo);
                modoActual = modo;
                triggerHaptic(haptic);
            }
        };

        // Eventos de clic simple
        btnBio.addEventListener('click', () => alternarModo('back', 12));
        btnRaw.addEventListener('click', () => alternarModo('raw', 10));
    }
// ==========================================
    // 4. CONTROLADORES DE INTERFAZ DE USUARIO
    // ==========================================
    function inicializarArtepanel() {
        // Inyectamos cada botón directamente en su contenedor del extremo correspondiente
        const stencilHolder = getCachedEl('menu-bio-STENCIL-holder');
        const panelHolder = getCachedEl('menu-bio-PANEL-holder');
        
        if (stencilHolder) {
            stencilHolder.innerHTML = `
                <span id="menu-bio-STENCIL" onclick="cambiarBioItem('STENCIL')" class="cursor-pointer tracking-[0.15em] transition-all duration-300 h-full w-full flex items-center justify-center font-bold">
                    STENCIL
                </span>`;
        }
        if (panelHolder) {
            panelHolder.innerHTML = `
                <span id="menu-bio-PANEL" onclick="cambiarBioItem('PANEL')" class="cursor-pointer tracking-[0.15em] transition-all duration-300 h-full w-full flex items-center justify-center font-bold">
                    PANEL
                </span>`;
        }
        
        vincularBotones();
        actualizarBioUI();
    }

    function cambiarBioItem(itemKey) {
        currentBioItem = itemKey;
        currentBioVariant = ARTEPANEL_CATALOG[itemKey].defaultVariant;
        actualizarBioUI();
        triggerHaptic(15);
    }

    function cambiarBioVariant(variantKey) {
        currentBioVariant = variantKey;
        actualizarBioUI();
        triggerHaptic(10);
    }

    // Cicla perfectamente respetando las llaves únicas de cada catálogo
    function ciclarVariante(tipo, direccion) {
        // Si el usuario clickea flechas de un grupo que no está activo, lo activamos
        if (currentBioItem !== tipo) {
            currentBioItem = tipo;
            currentBioVariant = ARTEPANEL_CATALOG[tipo].defaultVariant;
        }

        const variantes = Object.keys(ARTEPANEL_CATALOG[tipo].variants);
        let currentIndex = variantes.indexOf(currentBioVariant);

        // Fail-safe por si los estados globales se cruzaron
        if (currentIndex === -1) currentIndex = 0;

        // Navegación cíclica pura basada en el catálogo específico
        let nextIndex = (currentIndex + direccion) % variantes.length;
        if (nextIndex < 0) nextIndex = variantes.length - 1;

        currentBioVariant = variantes[nextIndex];
        actualizarBioUI();
        triggerHaptic(12);
    }

    // =========================================================================
    // 5. MOTOR DE TELEMETRÍA (LENGUAJE PULS)
    // =========================================================================
    function calculateSphereIndex() {
        const now = new Date();
        const epoch = new Date('2012-12-21T00:00:00Z');
        const daysSinceEpoch = Math.floor((now - epoch) / 86400000);
        
        // Calculamos qué parte del día es (0 a 3, representando los 4 bloques de 6 horas)
        const currentHour = now.getHours();
        const sphereQuadrant = Math.floor(currentHour / 6);
        
        // El índice total será (Días * 4) + el cuadrante actual
        const totalSpheres = (daysSinceEpoch * 4) + sphereQuadrant;
        
        return `${String(totalSpheres).padStart(4, '0')}`;
    }

    function updateZ() {
        let biokineticCoordinate = "";
        const now = new Date();
        const hours = now.getHours(); 
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        const currentSphereIdx = calculateSphereIndex();
        
        const elIdx = getCachedEl('telemetry-sphere-idx');
        if (elIdx && elIdx.textContent !== currentSphereIdx) elIdx.textContent = currentSphereIdx;

        let setsStage = 1;  
        let repsStage = 1;  
        let currentAction = 'P'; 

        if (seconds % 2 !== 0) {
            const progress1s = now.getMilliseconds() / 1000; 
            setsStage = Math.floor(progress1s * 12) + 1;
            repsStage = 13 - setsStage; 

            if (progress1s < 0.25) currentAction = 'P';
            else if (progress1s < 0.5) currentAction = 'U';
            else if (progress1s < 0.75) currentAction = 'L';
            else currentAction = 'S';
        } else {
            setsStage = Math.floor((minutes % 12) + 1);
            
            if (seconds < 30) {
                const subSlot = Math.floor((seconds % 30) / 7.5);
                currentAction = ["PL", "PU", "LU", "SU"][subSlot] || "PL";
                repsStage = Math.floor((seconds % 10) + 2);
            } else {
                const subSlot = Math.floor(((seconds - 30) % 30) / 7.5);
                currentAction = ["PUL", "PLS", "LUP", "ULS"][subSlot] || "ULS";
                repsStage = Math.floor(((seconds - 30) % 10) + 3);
            }
        }
        setsStage = Math.max(1, Math.min(12, setsStage));
        repsStage = Math.max(1, Math.min(12, repsStage));
        biokineticCoordinate = `${setsStage}${currentAction}${repsStage}`;

        const elDial = getCachedEl('z-dial');
        if (elDial) elDial.textContent = biokineticCoordinate;
                
        // Dentro de la función updateZ(), reemplaza la línea de activeNodeText por esta:
        const totalSecondsSinceMidnight = (hours * 3600) + (minutes * 60) + seconds;
        const activeNodeText = `${String(totalSecondsSinceMidnight + 1).padStart(4, '0')}`;
        const elActiveNode = getCachedEl('telemetry-active-node');
        if (elActiveNode) elActiveNode.textContent = activeNodeText;

        const subSetsSolar = getCachedEl('sub-sets-solar');
        const subRepsTension = getCachedEl('sub-reps-tension');
        if (subSetsSolar) subSetsSolar.textContent = `${(0.05 + (setsStage / 240)).toFixed(3)}`;
        if (subRepsTension) subRepsTension.textContent = `${(14.2 + (repsStage * 0.8)).toFixed(1)}`;
    }

    // TELEMETRY: Agrupamos todo el panel intermedio con los nuevos significados técnicos solicitados
    const TELEMETRY_MEANINGS = {
        'telemetry-sphere-idx': "Matrix actual (Ciclo temporal)", 
        'telemetry-active-node': "Cantidad de dials acumulados por matrix",
        'telemetry-product-dim': "Plantilla stencil (tamano, ej: 25x25)",
        'telemetry-product-dialex': "$0.05USD por dial biocinetico",
        'telemetry-product-price': "Compras tu pieza y financias otra para la comunidad"
    };

    // PULS_MEANINGS: Se mantiene intacto en el Header Superior
    const PULS_MEANINGS = {
        'sub-sets-solar': "Frecuencia de resonancia biocinética activa",
        'sub-reps-tension': "Índice de cohesión molecular y tensión de red"
    };

    // =========================================================================
    // MOTOR DE REVELADO DE TELEMETRÍA (ENCAPSULADO INDEPENDIENTE POR BLOQUE)
    // =========================================================================
    function actualizarBioUI() {
        const itemConfig = ARTEPANEL_CATALOG[currentBioItem];
        const variantConfig = itemConfig.variants[currentBioVariant];
        
        const descEl = getCachedEl('artepanel-description');
        const packImg = getCachedEl('artepanel-pack-img');
        const packImgBack = getCachedEl('artepanel-pack-img-back');
        
        if (descEl && packImg && packImgBack) {
            descEl.classList.add('opacity-0');
            
            setTimeout(() => {
                descEl.textContent = variantConfig.desc;
                packImg.src = variantConfig.img;
                packImgBack.src = variantConfig.imgBack;
                getCachedEl('artepanel-pack-img-raw').src = variantConfig.imgRaw;
                
                const labelTitle = getCachedEl('laser-variant-title');
                if (labelTitle) labelTitle.textContent = variantConfig.label;
                
                descEl.classList.remove('opacity-0');
            }, 120);
        }

        // --- NUEVA INYECCIÓN: Telemetría Técnica Dinámica en Pantalla ---
        const elDim = getCachedEl('telemetry-product-dim');
        const elDialEx = getCachedEl('telemetry-product-dialex');
        const elPrice = getCachedEl('telemetry-product-price');

        if (elDim) elDim.textContent = variantConfig.telemetry.DIM;
        if (elDialEx) elDialEx.textContent = variantConfig.telemetry.DIAL_EX;
        if (elPrice) elPrice.textContent = variantConfig.price;
        // ---------------------------------------------------------------

        const textFluidClass = "text-[8px] xs:text-[9.5px] sm:text-[11px] tracking-[0.2em] sm:tracking-[0.35em] uppercase font-sans transition-all duration-300";

        Object.keys(ARTEPANEL_CATALOG).forEach(item => {
            const el = getCachedEl(`menu-bio-${item}`);
            if (el) {
                const isSelected = (item === currentBioItem);
                el.textContent = item;
                el.className = isSelected 
                    ? `cursor-pointer font-black h-full w-full flex items-center justify-center text-white bg-white/[0.07] rounded-lg border border-white/20 shadow-[inset_0_1px_3px_rgba(255,255,255,0.25),_0_2px_8px_rgba(255,255,255,0.05)] ${textFluidClass}` 
                    : `cursor-pointer font-medium h-full w-full flex items-center justify-center text-white/20 bg-transparent rounded-lg hover:text-white/50 hover:bg-white/[0.02] ${textFluidClass}`;
            }
        });
    }

    function habilitarReveladoTelemetria() {
        
        //---------------------------------------------------------
        // BLOQUE 1: PANEL INTERMEDIO AUTOMATIZADO CON NUEVOS SIGNIFCADOS
        //---------------------------------------------------------
        const setupBloqueIntermedio = () => {
            const telemetryData = getCachedEl('panel-telemetry-data');
            const txtOriginal = "(MODELO 1:1) COMPRAS TU PIEZA Y FINANCIAS OTRA PARA LA COMUNIDAD";
            let timerIntermedio = null;

            const activarRevelado = (idElemento, mensajeTecnico) => {
                const el = getCachedEl(idElemento);
                if (!el || !telemetryData) return;

                el.addEventListener('click', () => {
                    clearTimeout(timerIntermedio);
                    
                    el.parentElement.classList.replace('text-white/50', 'text-white-400');
                    telemetryData.innerHTML = mensajeTecnico.toUpperCase();
                    
                    timerIntermedio = setTimeout(() => {
                        telemetryData.innerHTML = txtOriginal;
                        el.parentElement.classList.replace('text-white-400', 'text-white/50');
                    }, 8000);
                });
            };

            // Vinculamos de forma iterativa usando nuestro nuevo diccionario extendido
            Object.keys(TELEMETRY_MEANINGS).forEach(id => {
                activarRevelado(id, TELEMETRY_MEANINGS[id]);
            });
        };

        //---------------------------------------------------------
        // BLOQUE 2: HEADER SUPERIOR (MÉTRICAS TÉCNICAS P.U.L.S.)
        //---------------------------------------------------------
        const setupBloqueHeader = () => {
            const telemetryDataSecondary = getCachedEl('panel-telemetry-data-secondary');
            const txtOriginalSecondary = "LENGUAJE BIOCINÉTICO P.U.L.S.";
            let timerHeader = null;

            const activarReveladoHeader = (idElemento, mensajeTecnico) => {
                const el = getCachedEl(idElemento);
                if (!el || !telemetryDataSecondary) return;

                el.addEventListener('click', () => {
                    clearTimeout(timerHeader);
                    
                    el.parentElement.classList.replace('text-white/50', 'text-white-400');
                    telemetryDataSecondary.innerHTML = mensajeTecnico.toUpperCase();
                    
                    timerHeader = setTimeout(() => {
                        telemetryDataSecondary.innerHTML = txtOriginalSecondary;
                        el.parentElement.classList.replace('text-white-400', 'text-white/50');
                    }, 8000);
                });
            };

            Object.keys(PULS_MEANINGS).forEach(id => {
                activarReveladoHeader(id, PULS_MEANINGS[id]);
            });
        };

        setupBloqueIntermedio();
        setupBloqueHeader();
    }

    // =========================================================================
    // 6. CAPTURA DE TELEMETRÍA DE COMPRA (GENERACIÓN DE PAYLOAD)
    // =========================================================================
    function adquirirNodo() {
        const variantConfig = ARTEPANEL_CATALOG[currentBioItem].variants[currentBioVariant];
        const currentCoord = getCachedEl('z-dial')?.textContent || "N/A";
        const currentSphere = getCachedEl('telemetry-sphere-idx')?.textContent || "N/A";
        const currentNode = getCachedEl('telemetry-active-node')?.textContent || "N/A";
        
        // Captura de valores calculados en el DOM
        const freqValue = getCachedEl('sub-sets-solar')?.textContent || "0.00";
        const tensionValue = getCachedEl('sub-reps-tension')?.textContent || "0.0";
        
        // Traducción técnica bajo Sinergia Molecular Óptima
        const dialInterpretation = currentCoord.replace(/(\d+)([A-Z]+)(\d+)/, "$1 FASES, $3 NODOS - ESTADO $2");
        
        const mensaje = `⚡ *ORDEN - ARTEPANEL* ⚡\n\n` +
                        `• *Vector:* ${currentBioItem} ${currentBioVariant}\n` +
                        `• *Carga:* ${variantConfig.spec}\n` +
                        `• *ID:* \`${variantConfig.id}\`\n` +
                        `• *Precio:* ${variantConfig.price}\n\n` +
                        `--- *LENGUAJE P.U.L.S.* ---\n` +
                        `• *Matriz de Configuración:* \`${currentCoord}\`\n` +
                        `• *Análisis de Estado:* ${dialInterpretation}\n` +
                        `• *Lote:* \`${currentSphere}\`\n` +
                        `• *Saturación:* \`${currentNode}\`\n` +
                        `• *Resonancia:* \`${freqValue}\`\n` +
                        `• *Cohesión:* \`${tensionValue}\`\n\n` +
                        `Activar configuración actual.`;

        triggerHaptic([15, 40, 15]);
        window.open(`https://api.whatsapp.com/send?phone=${numeroCelular}&text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    // Inicialización coordinada del Ciclo de Vida del DOM
    document.addEventListener('DOMContentLoaded', () => {
        inicializarArtepanel();
        updateZ(); 
        setInterval(updateZ, 1000);
        habilitarReveladoTelemetria();
    });
</script>
