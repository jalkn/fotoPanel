<style>
        /* MOTOR BASE DE LA INTERFAZ */
        body { 
            font-family: 'Orbitron', sans-serif; 
            scroll-behavior: smooth; 
            letter-spacing: 0.05em; 
            background-color: #000000; 
            color: #f8fafc;
            /* Prevención de sobre-desplazamiento elástico en móviles */
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        } 

        /* CÁMARA OSCURA: Optimización de hardware para el gradiente bio-lumínico */
        #page-bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(60, 66, 79, 0.22) 0%, rgba(80, 96, 136, 0.75) 60%, #000000 100%);
            z-index: -1;
            /* transform y will-change aíslan el renderizado en su propia capa de la GPU */
            transform: translateZ(0);
            will-change: opacity, filter;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
        }

        /* TELEMETRÍA PURISTA: Escala neutral */
        .tele-label { color: #94a3b8; } 
        
        /* EFECTO LED BLANCO: Ajuste de subpíxel para evitar bordes dentados al escalar */
        .tele-value { 
            color: #ffffff; 
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.65), 0 0 4px rgba(255, 255, 255, 0.3);
            transform: translateZ(0);
        } 
        
        .border-custom { 
            border-color: rgba(255, 255, 255, 0.15); 
            transition: border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .border-custom:hover { border-color: rgba(255, 255, 255, 0.6); }

        /* VIDRIO HIPERREALISTA SIMÉTRICO */
        .glass { 
            background: rgba(5, 5, 8, 0.5); /* Unificado para Header y Footer */
            border: 1px solid rgba(255, 255, 255, 0.06); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transform: translateZ(0);
        }

        /* TRANSICIÓN DE GLOW: Eliminación total de saltos ópticos mediante hardware-acceleration */
        .img-glow-transition {
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            /* backface-visibility elimina parpadeos blancos en iOS y navegadores basados en WebKit */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: filter, transform, opacity;
        }

        /* OCULTAMIENTO ASÉPTICO DE SCROLLS */
        .custom-hud-scroll { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        .custom-hud-scroll::-webkit-scrollbar { 
            display: none; 
            width: 0 !important;
            height: 0 !important;
        }

        button, span, div {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

    let biokineticWaveHistory = []; 
    // Control de colapso visual del observador (false = ondas por defecto, true = texto alfanumérico)
    let isDialTextRevealed = false;

    // --- NUEVO: CONTROL DE SUB-PASOS E INDEPENDIZACIÓN DE CAPAS ---
    let currentWaveSubStep = 0; // Cambia de 0 a 2 cada tercio de segundo (internal, intermediate, external)

    // Diccionario de Vectores: Mapea de forma aséptica tus 12 variantes de acción a posiciones del reloj
    const VECTOR_TO_CLOCK_INDEX = {
        'P': 1,  'U': 2,  'L': 3,  'S': 4,
        'PL': 5, 'PU': 6, 'LU': 7, 'SU': 8,
        'PUL': 9,'LPS': 10,'SPU': 11,'ULS': 12
    };

    // ==========================================
    // 2. CACHÉ DE ELEMENTOS DE UI (OPTIMIZADO)
    // ==========================================
    const $ = (id) => document.getElementById(id);
    const cachedElements = {};
    
    function getCachedEl(id) {
        if (!cachedElements[id]) {
            cachedElements[id] = $(id);
        }
        return cachedElements[id];
    }

    const triggerHaptic = (ms) => { if (navigator.vibrate) navigator.vibrate(ms); };// // // // // =========================================================================
    // MOTOR GRÁFICO: TRIPLE ESTRUCTURA DE ONDAS CONSTRUIDAS (SISTEMA INDEX_10)
    // =========================================================================
    function renderBiokineticWaves() {
        const container = getCachedEl('wave-quantum-container');
        if (!container || biokineticWaveHistory.length === 0) return;

        let htmlContent = '';

        biokineticWaveHistory.forEach((dial, tIndex) => {
            const currentScale = tIndex * (3 / 3); 
            const baseOpacity = isDialTextRevealed ? 0.05 : (1.0 - (tIndex * 0.08));
            if (baseOpacity <= 0) return;

            const viewFactor = 18; 

            const layers = [
                { id: 'internal',     r: (currentScale * 1.0) * viewFactor, opacity: baseOpacity * 0.70, value: dial.sets },
                { id: 'intermediate', r: (currentScale * 1.4) * viewFactor, opacity: baseOpacity * 0.55, value: dial.vector },
                { id: 'external',     r: (currentScale * 1.8) * viewFactor, opacity: baseOpacity * 0.40, value: dial.reps }
            ];

            layers.forEach(layer => {
                if (layer.r <= 0) return;

                const circumference = 2 * Math.PI * layer.r;
                const angle = (layer.value - 1) * 30; 
                const arcLength = (layer.value / 12) * circumference;
                const dashArray = `${arcLength} ${circumference}`;

                // OPTIMIZACIÓN: Remoción de transiciones CSS para renderizado síncrono cuadro por cuadro (GPU)
                htmlContent += `
                    <circle 
                        id="wave-${layer.id}-t${tIndex}" 
                        cx="200" 
                        cy="200" 
                        r="${layer.r}" 
                        transform="rotate(${angle} 200 200)"
                        class="stroke-white"
                        stroke-width="${tIndex === 0 ? 1.5 : 1.0}"
                        stroke-opacity="${layer.opacity}"
                        stroke-dasharray="${dashArray}"
                        stroke-linecap="round"
                        fill="none"
                        style="will-change: r, stroke-opacity, stroke-dasharray;"
                    />`;
            });
        });

        container.innerHTML = htmlContent;
    }

// ==========================================
    // 3. MOTOR DE ESTADO VISUAL (Centralizado)
    // ==========================================
    function aplicarModoVisual(modo) {
        const front = getCachedEl('artepanel-pack-img');
        const back = getCachedEl('artepanel-pack-img-back');
        const raw = getCachedEl('artepanel-pack-img-raw');
        const svg = getCachedEl('laser-vector-target');

        // Reset general
        [front, back, raw].forEach(el => { if(el) el.style.opacity = '0'; });
        
        // Aplicar estado
        if (modo === 'front') {
            front.style.opacity = '1';
            front.style.zIndex = '10';
            back.style.zIndex = '0';
            if (svg) { svg.style.opacity = '1'; svg.style.pointerEvents = 'auto'; }
        } else if (modo === 'back') {
            back.style.opacity = '1';
            back.style.zIndex = '10';
            front.style.zIndex = '0';
            if (svg) { svg.style.opacity = '0'; svg.style.pointerEvents = 'none'; }
        } else if (modo === 'raw') {
            raw.style.opacity = '1';
            if (svg) { svg.style.opacity = '0'; svg.style.pointerEvents = 'none'; }
        }
    }

    function vincularBotones() {
        const btnRaw = getCachedEl('btn-reveal-raw');
        const btnDial = getCachedEl('btn-reveal-dial'); // <-- Capturar el botón DIAL
        
        let modoActual = 'front';

        if (btnRaw) {
            btnRaw.addEventListener('click', () => {
                if (modoActual === 'front') {
                    aplicarModoVisual('raw');
                    modoActual = 'raw';
                    triggerHaptic([10]);
                } else if (modoActual === 'raw') {
                    aplicarModoVisual('back');
                    modoActual = 'back';
                    triggerHaptic([12]);
                } else {
                    aplicarModoVisual('front');
                    modoActual = 'front';
                    triggerHaptic([8]);
                }
            });
        }

        // --- VINCULACIÓN DEL BOTÓN DIAL RECTIFICADO ---
        if (btnDial) {
            btnDial.addEventListener('click', () => {
                isDialTextRevealed = !isDialTextRevealed; 
                
                if (isDialTextRevealed) {
                    btnDial.classList.replace('text-white/40', 'text-white');
                    btnDial.classList.add('bg-white/[0.04]');
                } else {
                    btnDial.classList.replace('text-white', 'text-white/40');
                    btnDial.classList.remove('bg-white/[0.04]');
                }
                
                // Forzar revelado síncrono del grupo completo (Reloj + Texto)
                const sandwatchGroup = getCachedEl('sandwatch-group');
                if (sandwatchGroup) {
                    sandwatchGroup.style.opacity = isDialTextRevealed ? "1" : "0";
                    sandwatchGroup.style.pointerEvents = isDialTextRevealed ? "auto" : "none";
                }
                
                renderBiokineticWaves(); 
                triggerHaptic([10]);
            });
        }
    }
    // ==========================================
    // 4. CONTROLADORES DE INTERFAZ DE USUARIO
    // ==========================================
// Variable global o de entorno para saber qué tipo de vista está seleccionada ('STENCIL' o 'PANEL')
    let tipoVarianteActiva = 'STENCIL';

    function inicializarArtepanel() {
        const dynamicHolder = getCachedEl('menu-bio-DYNAMIC-holder');
        const btnPrev = getCachedEl('btn-variant-prev');
        const btnNext = getCachedEl('btn-variant-next');
        
        if (dynamicHolder) {
            // Función interna para refrescar el renderizado del texto dinámico central
            const renderTextoCentral = () => {
                dynamicHolder.innerHTML = `
                    <span id="menu-bio-${tipoVarianteActiva}" class="tracking-[0.15em] transition-all duration-300 h-full w-full flex items-center justify-center font-bold text-white/40 group-hover:text-white">
                        ${tipoVarianteActiva}
                    </span>`;
            };

            // Evento Clic Central: Alterna de forma cíclica entre STENCIL y PANEL
            dynamicHolder.addEventListener('click', () => {
                tipoVarianteActiva = (tipoVarianteActiva === 'STENCIL') ? 'PANEL' : 'STENCIL';
                
                renderTextoCentral();
                cambiarBioItem(tipoVarianteActiva); // Ejecuta tu lógica nativa de cambio de tipo
                triggerHaptic([10]);
            });

            // Inicialización del texto al cargar
            renderTextoCentral();
        }

        // Vincular flechas laterales a la variante activa en tiempo real
        if (btnPrev) {
            btnPrev.addEventListener('click', () => {
                ciclarVariante(tipoVarianteActiva, -1);
                triggerHaptic([6]);
            });
        }
        if (btnNext) {
            btnNext.addEventListener('click', () => {
                ciclarVariante(tipoVarianteActiva, 1);
                triggerHaptic([6]);
            });
        }
        
        vincularBotones();
        actualizarBioUI();
    }

    function cambiarBioItem(itemKey) {
        currentBioItem = itemKey;
        currentBioVariant = ARTEPANEL_CATALOG[itemKey].defaultVariant;
        actualizarBioUI();
        triggerHaptic(15);
    }

    function cambiarBioVariant(variantKey) {
        currentBioVariant = variantKey;
        actualizarBioUI();
        triggerHaptic(10);
    }

    // Cicla perfectamente respetando las llaves únicas de cada catálogo
    function ciclarVariante(tipo, direccion) {
        // Si el usuario clickea flechas de un grupo que no está activo, lo activamos
        if (currentBioItem !== tipo) {
            currentBioItem = tipo;
            currentBioVariant = ARTEPANEL_CATALOG[tipo].defaultVariant;
        }

        const variantes = Object.keys(ARTEPANEL_CATALOG[tipo].variants);
        let currentIndex = variantes.indexOf(currentBioVariant);

        // Fail-safe por si los estados globales se cruzaron
        if (currentIndex === -1) currentIndex = 0;

        // Navegación cíclica pura basada en el catálogo específico
        let nextIndex = (currentIndex + direccion) % variantes.length;
        if (nextIndex < 0) nextIndex = variantes.length - 1;

        currentBioVariant = variantes[nextIndex];
        actualizarBioUI();
        triggerHaptic(12);
    }

    // =========================================================================
    // 5. MOTOR DE TELEMETRÍA (LENGUAJE PULS)
    // =========================================================================
    function calculateSphereIndex() {
        const now = new Date();
        const epoch = new Date('2012-12-21T00:00:00Z');
        const daysSinceEpoch = Math.floor((now - epoch) / 86400000);
        
        // Calculamos qué parte del día es (0 a 3, representando los 4 bloques de 6 horas)
        const currentHour = now.getHours();
        const sphereQuadrant = Math.floor(currentHour / 6);
        
        // El índice total será (Días * 4) + el cuadrante actual
        const totalSpheres = (daysSinceEpoch * 4) + sphereQuadrant;
        
        return `${String(totalSpheres).padStart(4, '0')}`;
    }

    function updateZ() {
        const now = new Date();
        const hours = now.getHours(); 
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        const currentSphereIdx = calculateSphereIndex();
        const elIdx = getCachedEl('telemetry-sphere-idx');
        if (elIdx && elIdx.textContent !== currentSphereIdx) elIdx.textContent = currentSphereIdx;

        // --- MÁSCARA DE CONTROL: SISTEMA DE CONGELACIÓN TEMPORAL P.U.L.S. ---
        if (!window.isDialFrozen) {
            let setsStage = 1;  
            let repsStage = 1;  
            let currentAction = 'P'; 

            if (seconds % 2 !== 0) {
                const progress1s = now.getMilliseconds() / 1000; 
                setsStage = Math.floor(progress1s * 12) + 1;
                repsStage = 13 - setsStage; 

                if (progress1s < 0.25) currentAction = 'P';
                else if (progress1s < 0.5) currentAction = 'U';
                else if (progress1s < 0.75) currentAction = 'L';
                else currentAction = 'S';
            } else {
                setsStage = Math.floor((minutes % 12) + 1);
                
                if (seconds < 30) {
                    const subSlot = Math.floor((seconds % 30) / 7.5);
                    currentAction = ["PL", "PU", "LU", "SU"][subSlot] || "PL";
                    repsStage = Math.floor((seconds % 10) + 2);
                } else {
                    const subSlot = Math.floor(((seconds - 30) % 30) / 7.5);
                    currentAction = ["PUL", "LPS", "SPU", "ULS"][subSlot] || "ULS";
                    repsStage = Math.floor(((seconds - 30) % 10) + 3);
                }
            }
            
            setsStage = Math.max(1, Math.min(12, setsStage));
            repsStage = Math.max(1, Math.min(12, repsStage));
            const biokineticCoordinate = `${setsStage}${currentAction}${repsStage}`;

            // --- CAPTURA DE ONDA PARA HISTORIAL FIFO ---
            const vectorIndex = VECTOR_TO_CLOCK_INDEX[currentAction] || 1;

            const lastSavedDial = biokineticWaveHistory[0];
            if (!lastSavedDial || lastSavedDial.rawCoord !== biokineticCoordinate) {
                // Insertar nuevo dial completo en el epicentro (t0)
                biokineticWaveHistory.unshift({
                    sets: setsStage,
                    vector: vectorIndex,
                    reps: repsStage,
                    rawCoord: biokineticCoordinate
                });
                
                // CAMBIO: Elevamos el pool de ondas a 12 para que tengan tiempo de viajar al exterior
                if (biokineticWaveHistory.length > 12) {
                    biokineticWaveHistory.pop();
                }
            }

            // Invocar renderizado unificado
            renderBiokineticWaves();

// Sincronizar texto alfanumérico gigante y su entorno geométrico
            const elDial = getCachedEl('z-dial');
            if (elDial) elDial.textContent = biokineticCoordinate;
            
            const sandwatchGroup = getCachedEl('sandwatch-group');
            if (sandwatchGroup) {
                sandwatchGroup.style.opacity = isDialTextRevealed ? "1" : "0";
                sandwatchGroup.style.pointerEvents = isDialTextRevealed ? "auto" : "none";
            }
                    
            // Actualizar sub-métricas del HUD superior
            const subSetsSolar = getCachedEl('sub-sets-solar');
            const subRepsTension = getCachedEl('sub-reps-tension');
            if (subSetsSolar) subSetsSolar.textContent = `${(0.05 + (setsStage / 240)).toFixed(3)}`;
            if (subRepsTension) subRepsTension.textContent = `${(14.2 + (repsStage * 0.8)).toFixed(1)}`;

            // Actualizar Dial Espejo (HUD superior centro)
            const elDialMirror = getCachedEl('z-dial-mirror');
            if (elDialMirror) elDialMirror.textContent = biokineticCoordinate;
        }
                
        // Nodos (Saturación) sigue fluyendo en tiempo real de forma aséptica
        const totalSecondsSinceMidnight = (hours * 3600) + (minutes * 60) + seconds;
        const activeNodeText = `${String(totalSecondsSinceMidnight + 1).padStart(4, '0')}`;
        const elActiveNode = getCachedEl('telemetry-active-node');
        if (elActiveNode) elActiveNode.textContent = activeNodeText;
    }

    // TELEMETRY: Panel material de transferencia física e intercambio.
    const TELEMETRY_MEANINGS = {
        'telemetry-product-dim': "Conversion del dial en el espacio", 
        'telemetry-product-dial': "Cantidad de ondas biocinéticas."
    };
    
    // PULS_MEANINGS: Nomenclatura Biocinética Orientada a Geometría de Cristal
    const PULS_MEANINGS = {
        'sub-sets-solar-trigger': "ONDA INTERNA DE FRECUENCIA COAXIAL TIERRA-LUNA-SOL.", 
        'sub-reps-tension-trigger': "ONDA EXTERNA DE MAGNETISMO GRAVITACIONAL.", 
        'z-dial-trigger': () => {
            const coord = getCachedEl('z-dial-mirror')?.textContent || "1P1";
            const match = coord.match(/^(\d+)([A-Z]+)(\d+)$/);
            if (!match) return "MATRIZ BIOCINÉTICA ACTIVA.";
            
            const [_, sets, action, reps] = match;
            let vectorText = "";

            // Mapeo sintáctico definitivo: Integración técnico-militar de magnitudes físicas
            switch (action) {
                // --- FUERZAS PURAS Y ABSOLUTAS ---
                case 'P':  vectorText = `PASOS X${sets}`; break; // El multiplicador final ahora son los Sets (sets)
                case 'S':  vectorText = `SALTOS X${sets}`; break; 
                case 'U':  vectorText = `PRESIONES X${sets}`; break; 
                case 'L':  vectorText = `CARGAS X${sets}`; break;    
                
                // --- FUERZAS DUALES DE BALANCE ---
                case 'PL': vectorText = `PASOS CON CARGA X${sets}`; break;
                case 'PU': vectorText = `PASOS CON PRESIÓN X${sets}`; break;
                case 'LU': vectorText = `CARGAS CON PRESIÓN X${sets}`; break;
                case 'SU': vectorText = `SALTOS CON PRESIÓN X${sets}`; break;
                
                // --- VÓRTICES COMPLEJOS DE ILUMINACIÓN (Sincronizados al Motor Analógico) ---
                case 'PUL': vectorText = `PASOS CON PRESIÓN Y CARGA X${sets}`; break;
                case 'LPS': vectorText = `CARGAS CON PASO Y SALTO X${sets}`; break;
                case 'SPU': vectorText = `SALTOS CON PASO Y PRESIÓN X${sets}`; break; 
                case 'ULS': vectorText = `PRESIONES CON CARGA Y SALTO X${sets}`; break;
                
                default: vectorText = "ONDA BIOCINÉTICA REGENERATIVA";
            }

            // Entrega continua aséptica: Las Reps (reps) van al inicio, seguidas del vector y sus Sets (vectorText)
            return `${reps} ${vectorText}`;

        }, 
        'telemetry-sphere-idx-trigger': "NUMERO DE LOTE, CICLO O MATRIZ CUÁNTICA", 
        'telemetry-active-node-trigger': "NODOS ACUMULADOS REALES." 
    };

    function actualizarBioUI() {
        const itemConfig = ARTEPANEL_CATALOG[currentBioItem];
        const variantConfig = itemConfig.variants[currentBioVariant];
        
        const descEl = getCachedEl('artepanel-description');
        const packImg = getCachedEl('artepanel-pack-img');
        const packImgBack = getCachedEl('artepanel-pack-img-back');
        
        if (descEl && packImg && packImgBack) {
            descEl.classList.add('opacity-0');
            
            setTimeout(() => {
                descEl.textContent = variantConfig.desc;
                packImg.src = variantConfig.img;
                packImgBack.src = variantConfig.imgBack;
                getCachedEl('artepanel-pack-img-raw').src = variantConfig.imgRaw;
                
                const labelTitle = getCachedEl('laser-variant-title');
                if (labelTitle) labelTitle.textContent = variantConfig.label;
                
                descEl.classList.remove('opacity-0');
            }, 120);
        }

        // Sincronización milimétrica con la Telemetría del Footer Comercial
        const elDim = getCachedEl('telemetry-product-dim');
        const elDial = getCachedEl('telemetry-product-dial');

        if (elDim) elDim.textContent = variantConfig.telemetry.DIM;
        if (elDial) elDial.textContent = variantConfig.telemetry.DIAL;

        const textFluidClass = "text-[8px] xs:text-[9.5px] sm:text-[11px] tracking-[0.2em] sm:tracking-[0.35em] uppercase font-sans transition-all duration-300";

        Object.keys(ARTEPANEL_CATALOG).forEach(item => {
            const el = getCachedEl(`menu-bio-${item}`);
            if (el) {
                const isSelected = (item === currentBioItem);
                el.textContent = item;
                el.className = isSelected 
                    ? `cursor-pointer font-black h-full w-full flex items-center justify-center text-white bg-white/[0.07] rounded-lg border border-white/20 shadow-[inset_0_1px_3px_rgba(255,255,255,0.25),_0_2px_8px_rgba(255,255,255,0.05)] ${textFluidClass}` 
                    : `cursor-pointer font-medium h-full w-full flex items-center justify-center text-white/20 bg-transparent rounded-lg hover:text-white/50 hover:bg-white/[0.02] ${textFluidClass}`;
            }
        });
    }

    function habilitarReveladoTelemetria() {
        
        //---------------------------------------------------------
        // MOTOR 1: PANEL COMERCIAL (Inyección en Footer Centro)
        //---------------------------------------------------------
        const setupBloqueComercial = () => {
            const telemetryData = getCachedEl('panel-telemetry-data');
            const txtOriginal = "Compras tu pieza y financias otra para la comunidad";
            let timerComercial = null;

            Object.keys(TELEMETRY_MEANINGS).forEach(id => {
                const el = getCachedEl(id);
                if (!el || !telemetryData) return;

                el.addEventListener('click', () => {
                    clearTimeout(timerComercial);
                    
                    el.parentElement.classList.remove('text-white/50');
                    el.parentElement.classList.add('text-white');
                    telemetryData.innerHTML = TELEMETRY_MEANINGS[id];
                    
                    timerComercial = setTimeout(() => {
                        telemetryData.innerHTML = txtOriginal;
                        el.parentElement.classList.remove('text-white');
                        el.parentElement.classList.add('text-white/50');
                    }, 8000);
                });
            });
        };

        //---------------------------------------------------------
        // MOTOR 2: UNIVERSO ONDULATORIO (Inyección en Header Centro)
        //---------------------------------------------------------
        const setupBloqueQuantum = () => {
            const telemetryDataSecondary = getCachedEl('panel-telemetry-data-secondary');
            const txtOriginalSecondary = "ONDA BIOCINÉTICA REGENERATIVA";
            let timerQuantum = null;

            Object.keys(PULS_MEANINGS).forEach(id => {
                const el = getCachedEl(id);
                if (!el || !telemetryDataSecondary) return;

                const esHeaderPuro = id.startsWith('sub-');
                const contenedorLed = esHeaderPuro ? el.parentElement : el;

                el.addEventListener('click', () => {
                    clearTimeout(timerQuantum);
                    
                    if (id === 'z-dial-trigger') {
                        window.isDialFrozen = true;
                    }

                    if (esHeaderPuro) {
                        contenedorLed.classList.replace('text-white/60', 'text-white');
                    } else if (id === 'z-dial-trigger') {
                        el.style.filter = "drop-shadow(0 0 25px rgba(255,255,255,0.95))";
                    } else {
                        contenedorLed.classList.replace('text-white/40', 'text-white');
                        contenedorLed.querySelector('span:last-child').classList.replace('text-white', 'text-white/60');
                    }
                    
                    const meaningValue = PULS_MEANINGS[id];
                    telemetryDataSecondary.innerHTML = typeof meaningValue === 'function' ? meaningValue() : meaningValue;
                    
                    timerQuantum = setTimeout(() => {
                        telemetryDataSecondary.innerHTML = txtOriginalSecondary;
                        
                        if (id === 'z-dial-trigger') {
                            window.isDialFrozen = false;
                            el.style.filter = "none";
                        }

                        if (esHeaderPuro) {
                            contenedorLed.classList.replace('text-white', 'text-white/60');
                        } else if (id !== 'z-dial-trigger') {
                            contenedorLed.classList.replace('text-white', 'text-white/40');
                            contenedorLed.querySelector('span:last-child').classList.replace('text-white', 'text-white/60');
                        }
                    }, 8000);
                });
            });
        };

        setupBloqueComercial();
        setupBloqueQuantum();
    }

    // =========================================================================
    // 6. CAPTURA DE TELEMETRÍA DE COMPRA (GENERACIÓN DE PAYLOAD)
    // =========================================================================
    function adquirirNodo() {
        const variantConfig = ARTEPANEL_CATALOG[currentBioItem].variants[currentBioVariant];
        const currentCoord = getCachedEl('z-dial')?.textContent || "N/A";
        const currentSphere = getCachedEl('telemetry-sphere-idx')?.textContent || "N/A";
        const currentNode = getCachedEl('telemetry-active-node')?.textContent || "N/A";
        
        // Captura de valores calculados en el DOM
        const freqValue = getCachedEl('sub-sets-solar')?.textContent || "0.00";
        const tensionValue = getCachedEl('sub-reps-tension')?.textContent || "0.0";
        
        // Traducción técnica bajo Sinergia Molecular Óptima
        const dialInterpretation = currentCoord.replace(/(\d+)([A-Z]+)(\d+)/, "$1 FASES, $3 NODOS - ESTADO $2");
        
        const mensaje = `⚡ *ORDEN - ARTEPANEL* ⚡\n\n` +
                        `• *Vector:* ${currentBioItem} ${currentBioVariant}\n` +
                        `• *Carga:* ${variantConfig.spec}\n` +
                        `• *ID:* \`${variantConfig.id}\`\n` +
                        `• *Precio:* ${variantConfig.price}\n\n` +
                        `--- *LENGUAJE P.U.L.S.* ---\n` +
                        `• *Matriz de Configuración:* \`${currentCoord}\`\n` +
                        `• *Análisis de Estado:* ${dialInterpretation}\n` +
                        `• *Lote:* \`${currentSphere}\`\n` +
                        `• *Saturación:* \`${currentNode}\`\n` +
                        `• *Resonancia:* \`${freqValue}\`\n` +
                        `• *Cohesión:* \`${tensionValue}\`\n\n` +
                        `Activar configuración actual.`;

        triggerHaptic([15, 40, 15]);
        window.open(`https://api.whatsapp.com/send?phone=${numeroCelular}&text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
        inicializarArtepanel();
        updateZ(); 
        
        // MOTOR DE TELEMETRÍA Y ONDAS UNIFICADO (1 segundo estricto)
        setInterval(updateZ, 1000);

        habilitarReveladoTelemetria();

        // Desactivar bloqueo de puntero sobre el SVG general para liberar interacciones traseras
        const laserSvg = getCachedEl('laser-vector-target');
        if (laserSvg) {
            laserSvg.style.pointerEvents = 'none'; 
        }

        // Reconexión y escucha independiente sobre el texto reactivo del Dial
        const zDialSvgText = getCachedEl('z-dial');
        if (zDialSvgText) {
            zDialSvgText.style.cursor = 'pointer';
            zDialSvgText.style.pointerEvents = 'auto'; 
            zDialSvgText.addEventListener('click', (e) => {
                e.stopPropagation();
                getCachedEl('z-dial-trigger')?.click();
            });
        }
    });
</script>
