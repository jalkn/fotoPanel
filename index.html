<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKO VAULT</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
 <style>
        /* ACHROMATIC ENVIRONMENT VARIABLES */
        :root[data-theme="dark"] {
            --jako-bg: rgba(5, 5, 8, 0.92);
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.094);
            --jako-glass: rgba(0, 0, 0, 0.5);
            --jako-led: rgba(255, 255, 255, 0.65);
            --gradient-start: rgba(255, 255, 255, 0.03);
            --gradient-mid: rgba(5, 5, 8, 0.85);
            --gradient-end: #000000;
            --icon-hover: #b6b8b9;
        }

        :root[data-theme="white"] {
            --jako-bg: #f8f9fa;
            --jako-text: #000000;
            --jako-border: rgba(0, 0, 0, 0.12);
            --jako-glass: rgba(255, 255, 255, 0.4);
            --jako-led: rgba(233, 227, 227, 0.455);
            --gradient-start: rgba(0, 0, 0, 0.02);
            --gradient-mid: rgba(248, 249, 250, 0.85);
            --gradient-end: #ffffff;
            --icon-hover: #b6b8b9;
        }

        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        /* BASE VIEWPORT & LAYOUT ENGINE */
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body { 
            font-family: 'Orbitron', monospace, sans-serif; 
            background-color: var(--jako-bg); 
            color: var(--jako-text); 
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            transition: background-color 0.5s ease, color 0.5s ease;
        } 

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        /* AMBIENT OVERLAYS */
        #page-bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
            will-change: background;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ambient-gradient {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
            z-index: 0;
            pointer-events: none;
        }

        /* OPTICAL GLOW TRANSITION */
        .img-glow-transition {
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: filter, transform, opacity;
        }

        /* BUTTONS & CONTROLS */
        .btn-tele-glass {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--jako-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-tele-glass:hover {
            opacity: 0.8;
        }

        .btn-tele-glass:active {
            transform: scale(0.92);
        }

        .icon-tele, .icon-stroke {
            width: 1rem;
            height: 1rem;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        .icon-tele {
            fill: var(--jako-text);
            pointer-events: none;
        }

        .icon-stroke {
            stroke: var(--jako-text);
        }

        .btn-tele-glass:hover .icon-tele { fill: var(--icon-hover); }
        .btn-tele-glass:hover .icon-stroke { stroke: var(--icon-hover); }

        /* VISUALIZER STAGE */
        .main-visualizer-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            position: relative;
            overflow: hidden;
            transition: padding 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #fotopanel-pack-container {
            position: relative;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            margin: auto;
            cursor: pointer;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.6));
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #fotopanel-pack-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* PRODUCT SPEC STRIP (PINNED TO BOTTOM WITHOUT DISPLACING STAGE CENTER) */
        .info-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            color: var(--jako-text);
            font-size: 8px;
            letter-spacing: 0.25em;
            width: 100%;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            gap: 0.5rem;
            z-index: 20;
        }

        .info-strip-content {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .info-separator {
            opacity: 0.4;
            font-weight: 300;
        }

        .tele-value { 
            color: var(--jako-text); 
            text-shadow: var(--jako-led), var(--jako-led);
            transform: translateZ(0);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        /* ACTION CONTROLS & DRAWERS */
        .action-controls-wrapper {
            position: relative;
            width: 100%;
            z-index: 100;
        }

        .action-controls-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            align-items: center;
            width: 100%;
            padding: 0 1rem;
            height: 3rem;
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: background 0.5s ease, border-color 0.5s ease, opacity 0.5s ease, transform 0.5s ease;
        }

        .action-controls-grid .btn-tele-glass {
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .drawer-overlay {
            position: absolute;
            bottom: 3rem;
            left: 0;
            width: 100%;
            z-index: 40;
            background: var(--jako-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--jako-border);
            animation: drawerSlideUp 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes drawerSlideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FOOTER */
        .footer-container {
            height: 50px;
            width: 100%;
            flex-shrink: 0;
            background: var(--jako-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 50;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid var(--jako-border);
        }

        .footer-brand-text {
            font-size: 6px;
            letter-spacing: 0.35em;
            font-weight: 700;
            color: var(--jako-text);
            opacity: 0.5;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
        }

        .footer-container:hover .footer-brand-text {
            opacity: 0.9;
        }

        /* ZENITH MODE (FULLSCREEN IMMERSION) */
        .zenith-active .top-nav-bar,
        .zenith-active .info-strip,
        .zenith-active .action-controls-wrapper,
        .zenith-active footer {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(15px);
        }

        .zenith-active .top-nav-bar {
            transform: translateY(-15px);
        }

        .zenith-active main {
            padding: 0 !important;
        }

        .zenith-active #fotopanel-pack-container {
            transform: scale(1.15);
            filter: drop-shadow(0 35px 80px rgba(0,0,0,0.95));
        }

        /* UNIFIED TRANSITIONS */
        .top-nav-bar, .info-strip, .action-controls-wrapper, footer, #fotopanel-pack-container {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease, border-color 0.5s ease;
        }

        button, span, div { -webkit-tap-highlight-color: transparent; }
        button, input, select, textarea { font-family: inherit; }
    </style>
</head>
<body>

    <div id="page-bg-overlay"></div>
    <div class="ambient-gradient"></div>
        
    <!-- Top Action Dispatcher Bar -->
    <div class="top-nav-bar" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 1rem; height: 3rem; border-bottom: 1px solid var(--jako-border); background: var(--jako-glass); backdrop-filter: blur(20px);">
        
        <!-- Columna 1: Toggle Theme (Extremo Izquierdo) -->
        <div style="display: flex; justify-content: flex-start;">

        </div>

        <!-- Columna 2: Home / Reset (Centro Exacto) -->
        <button class="btn-tele-glass" title="Home / Reset" onclick="resetView()" style="width: auto; padding: 0 1rem; display: flex; align-items: center; gap: 0.5rem; font-size: 10px; font-weight: 700; letter-spacing: 0.15em;">
            <svg viewBox="0 0 100 100" class="icon-tele" style="width: 0.85rem; height: 0.85rem;">
                <g transform="rotate(180 50 50)">
                    <polygon points="50,42 58,50 50,58 42,50" />
                    <polygon points="30,65 70,65 80,80 20,80" />
                </g>
            </svg>
            <span class="justify-self-center text-center tracking-[0.25em] font-bold text-white text-[12px] sm:text-[11px]">JAKO</span>
        </button>

        <!-- Columna 3: Order Dispatcher / Cashflow (Extremo Derecho) -->
        <div style="display: flex; justify-content: flex-end;">
        </div>

    </div>

<!-- Visualizer Stage -->
    <main class="main-visualizer-container" onclick="handleStageClick(event)">
        <div id="fotopanel-pack-container" onclick="handlePanelClick(event)">
            <div class="pack-viewport">
                <img id="fotopanel-pack-img-back" src="img/20x20B.png" alt="Pulsor Back" class="img-glow-transition" style="opacity: 0; pointer-events: none; z-index: 0;" />
                <img id="fotopanel-pack-img" src="img/surface.png" alt="Pulsor Front" class="img-glow-transition" style="opacity: 1; pointer-events: auto; z-index: 10;" />
            </div>
        </div>

        <!-- Product Spec Strip (Bottom-pinned inside main) -->
        <div class="info-strip">
            <div class="info-strip-content">
                <span id="fotopanel-label" class="tele-value">PULSOR PANEL 40X40</span>
                <span class="info-separator">/</span>
                <span id="fotopanel-price" class="tele-value">$40MIL</span>
            </div>

            <!-- Columna 3: Order Dispatcher / Cashflow (Extremo Derecho) -->
            <div style="display: flex; justify-content: flex-end;">
                <button id="btn-activate-node" title="Order via WhatsApp" onclick="acquireNodeCashflow()" class="btn-tele-glass btn-highlight-action" style="width: auto; padding: 0.5rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M12 3v13.5m0 0l-4.5-4.5M12 16.5l4.5-4.5" />
                    </svg>
                </button>
            </div>
        </div>
    </main>
 
    
<!-- Control Wrapper -->
    <div class="action-controls-wrapper">

        <!-- SUBSTRATE COLOR SELECTOR DRAWER -->
        <div id="drawer-color-palette" class="drawer-overlay" style="display: none;">
            <div class="color-picker-palette">
                <div class="color-swatch" style="background: #09090b;" onclick="setSubstrateColor('#09090b')"></div>
                <div class="color-swatch" style="background: #27272a;" onclick="setSubstrateColor('#27272a')"></div>
                <div class="color-swatch" style="background: #f4f4f5;" onclick="setSubstrateColor('#f4f4f5')"></div>
                <div class="color-swatch" style="background: #e2e8f0;" onclick="setSubstrateColor('#e2e8f0')"></div>
                <div class="color-swatch" style="background: #78350f;" onclick="setSubstrateColor('#78350f')"></div>
                <div class="color-swatch" style="background: #064e3b;" onclick="setSubstrateColor('#064e3b')"></div>
            </div>
        </div>

        <!-- MAIN DISPATCHER BAR (5 Controls) -->
        <div class="action-controls-grid">

            <!-- 1. Next Variant Button -->
            <button id="btn-next-variant" title="Next Variant Scale" onclick="rotateFotoVariant('next')" class="btn-tele-glass">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4M9 9h6v6H9z" />
                </svg>
            </button>

            <!-- 2. Dot Color Button -->
            <button id="btn-dot-color" title="Dot Color" onclick="toggleDotColor()" class="btn-tele-glass">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                    <circle cx="12" cy="12" r="7" />
                </svg>
            </button>

            <!-- 3. Substrate Color Button -->
            <button id="btn-color-substrate" title="Panel Color Gradient" onclick="toggleSubstrateDrawer()" class="btn-tele-glass">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                    <rect x="4" y="4" width="16" height="16" rx="1" />
                </svg>
            </button>

            <!-- 4. Theme Toggle Button (Achromatic) -->
            <button id="acromatic-toggle-trigger" title="Toggle Theme" class="btn-tele-glass">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="icon-stroke">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21m8.966-8.966h-2.25M4.284 12h-2.25m15.356-6.364l-1.591 1.591M6.364 17.636l-1.591 1.591m12.728 0l-1.591-1.591M6.364 6.364L4.773 4.773M12 8.25a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z" />
                </svg>
            </button>

            <!-- 5. Zenith Mode Button -->
            <button id="btn-zenith-toggle" title="Zenith Mode" onclick="toggleZenithMode()" class="btn-tele-glass">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="icon-stroke">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                </svg>
            </button>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-container">
        <span class="footer-brand-text">JAKO RESEARCH 2008-2026</span>
    </footer>

    <!-- Core Logic Engine -->
    <script>
        // Catalog Configuration Schema
        const ARTEPANEL_CATALOG = {
            'PULSOR': {
                defaultVariant: 'PANEL 20X20',
                variants: {
                    'PANEL 20X20': { 
                        label: 'FOTOPANEL 20X20CMS', 
                        spec: 'Community Mural Funding', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$20USD', 
                        id: 'FP-20X20',
                        img: 'img/surface.png', 
                        imgBack: 'img/20x20B.png'
                    },
                    'PANEL 30X30': { 
                        label: 'FOTOPANEL 30X30CMS', 
                        spec: 'Community Mural Funding', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$30USD', 
                        id: 'FP-30X30',
                        img: 'img/surface.png', 
                        imgBack: 'img/30x30B.png'
                    },
                    'PANEL 40X40': { 
                        label: 'FOTOPANEL40X40CMS', 
                        spec: 'Community Mural Funding', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$40USD', 
                        id: 'FP-40X40',
                        img: 'img/surface.png', 
                        imgBack: 'img/40x40B.png'
                    }
                }
            }
        };

        // Core Application State
        let currentFotoItem = 'PULSOR';
        let currentFotoVariant = 'PANEL 20X20';
        let currentSubstrateColor = '#09090b';
        let currentDotColor = '#ffffff';
        let inspectModeIndex = 0; // 0: Front, 1: Back
        let isZenithActive = false;
        const targetPhoneNumber = "573128707083";

        // Element Cache Registry
        const $ = (id) => document.getElementById(id);
        const cachedElements = {};
        const getCachedEl = (id) => cachedElements[id] || (cachedElements[id] = $(id));

        // Haptic Feedback Trigger
        const triggerHaptic = (pattern) => { 
            if (navigator.vibrate) navigator.vibrate(pattern); 
        };

        // Color Dynamic State Handlers
        function setSubstrateColor(hex) {
            currentSubstrateColor = hex;
            const substrate = getCachedEl('svg-substrate');
            if (substrate) substrate.setAttribute('fill', hex);
            triggerHaptic(10);
        }

        function toggleSubstrateDrawer() {
            const drawer = getCachedEl('drawer-color-palette');
            if (!drawer) return;
            const isOpen = drawer.style.display === 'block';
            drawer.style.display = isOpen ? 'none' : 'block';
            triggerHaptic(8);
        }

        function toggleDotColor() {
            currentDotColor = currentDotColor === '#ffffff' ? '#000000' : '#ffffff';
            const dots = getCachedEl('svg-halftone-dots');
            if (dots) dots.setAttribute('fill', currentDotColor);
            triggerHaptic(12);
        }

        function closeAllDrawers() {
            const palette = getCachedEl('drawer-color-palette');
            if (palette) palette.style.display = 'none';
        }

        // Zenith Mode Toggle Engine
        function toggleZenithMode() {
            isZenithActive = !isZenithActive;
            document.body.classList.toggle('zenith-active', isZenithActive);
            closeAllDrawers();
            triggerHaptic([15, 30, 15]);
        }

        // Stage Touch Handler
        function handleStageClick(event) {
            if (isZenithActive) {
                toggleZenithMode();
            } else {
                closeAllDrawers();
            }
        }

        // Panel Direct Touch Handler
        function handlePanelClick(event) {
            event.stopPropagation();
            if (isZenithActive) {
                toggleZenithMode();
                return;
            }
            toggleInspectView();
        }

        // Visual Inspector Switcher (Front <-> Back)
        function toggleInspectView() {
            inspectModeIndex = (inspectModeIndex + 1) % 2;
            const modes = ['front', 'back'];
            applyVisualMode(modes[inspectModeIndex]);
            triggerHaptic(10);
        }

        // Apply Layer Opacity Based on Selected Visual Mode
        function applyVisualMode(mode) {
            const layers = [
                { el: getCachedEl('fotopanel-pack-img'), mode: 'front', index: 0 },
                { el: getCachedEl('fotopanel-pack-img-back'), mode: 'back', index: 1 }
            ];

            layers.forEach(({ el, mode: m, index }) => {
                if (!el) return;
                const isActive = (m === mode);
                el.style.opacity = isActive ? '1' : '0';
                el.style.zIndex = isActive ? '10' : '0';
                if (isActive) inspectModeIndex = index;
            });
        }

        // Rotate Through Catalog Variants
        function rotateFotoVariant(direction = 'next') {
            const variants = Object.keys(ARTEPANEL_CATALOG[currentFotoItem].variants);
            let currentIndex = variants.indexOf(currentFotoVariant);
            
            if (direction === 'next') {
                currentIndex = (currentIndex + 1) % variants.length;
            } else {
                currentIndex = (currentIndex - 1 + variants.length) % variants.length;
            }
            
            currentFotoVariant = variants[currentIndex];
            updateFotoUI();
            triggerHaptic(15);
        }

        // Reset View to Default
        function resetView() {
            currentFotoVariant = 'PANEL 40X40';
            applyVisualMode('front');
            updateFotoUI();
            triggerHaptic([10, 10]);
        }

        // Sync UI Elements
        function updateFotoUI() {
            const config = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            
            const front = getCachedEl('fotopanel-pack-img');
            const back = getCachedEl('fotopanel-pack-img-back');
            const label = getCachedEl('fotopanel-label');
            const price = getCachedEl('fotopanel-price');
            
            if (front) front.src = config.img;
            if (back) back.src = config.imgBack;
            if (label) label.textContent = config.label;
            if (price) price.textContent = config.price;
        }

        // WhatsApp Order Dispatcher
        function acquireNodeCashflow() {
            const variant = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const message = [
                `ORDER: ${variant.label}`,
                `VARIANT: ${currentFotoVariant}`,
                `SPEC: ${variant.spec}`,
                `MEDIA: ${variant.media}`,
                `FINISH: ${variant.finish}`,
                `ID: ${variant.id}`,
                `PRICE: ${variant.price}`
            ].join('\n');

            triggerHaptic([15, 40, 15]);
            window.open(`https://api.whatsapp.com/send?phone=${targetPhoneNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        // Achromatic Theme Switcher
        function initAchromaticToggle() {
            const trigger = getCachedEl('acromatic-toggle-trigger');
            if (!trigger) return;

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                const htmlNode = document.documentElement;
                const currentTheme = htmlNode.getAttribute('data-theme') || 'dark';
                const nextTheme = currentTheme === 'dark' ? 'white' : 'dark';
                
                htmlNode.setAttribute('data-theme', nextTheme);
                triggerHaptic([20, 10]);
            });
        }

        // Initialize Application Controls
        document.addEventListener('DOMContentLoaded', () => {
            initAchromaticToggle();
            updateFotoUI();

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.action-controls-wrapper') && !e.target.closest('.top-nav-bar')) {
                    closeAllDrawers();
                }
            });
        });
    </script>
</body>
</html>
