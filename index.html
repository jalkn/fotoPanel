<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOTOPANEL</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME CONFIGURATION
           ========================================================================== */
        :root[data-theme="dark"] {
            --jako-bg: #121212;
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.15);
            --jako-glass: rgba(30, 30, 30, 0.65);
            --jako-led: rgba(255, 255, 255, 0.6);
            --gradient-start: rgba(255, 255, 255, 0.05);
            --gradient-mid: rgba(18, 18, 18, 0.85);
            --gradient-end: #121212;
            --icon-hover: #ffffff;
        }

        :root[data-theme="light"] {
            --jako-bg: #f8f9fa;
            --jako-text: #000000;
            --jako-border: rgba(0, 0, 0, 0.12);
            --jako-glass: rgba(255, 255, 255, 0.65);
            --jako-led: rgba(0, 0, 0, 0.3);
            --gradient-start: rgba(0, 0, 0, 0.02);
            --gradient-mid: rgba(248, 249, 250, 0.85);
            --gradient-end: #ffffff;
            --icon-hover: #666666;
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE STYLES
           ========================================================================== */
        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: inherit;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
        }

        body { 
            font-family: 'Orbitron', monospace, sans-serif; 
            background-color: var(--jako-bg); 
            color: var(--jako-text); 
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            position: relative;
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            transition: background-color 0.5s ease, color 0.5s ease;
        } 

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        button, span, div { -webkit-tap-highlight-color: transparent; }

        /* Background Overlays */
        #page-bg-overlay, .ambient-gradient {
            position: fixed;
            inset: 0;
        }

        #page-bg-overlay {
            background: radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
            will-change: background;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ambient-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
            z-index: 0;
            pointer-events: none;
        }

        /* Unified Transitions */
        .img-glow-transition, .info-strip, .action-controls-grid, footer, #fotopanel-pack-container, .panel-back-view {
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s ease, border-color 0.4s ease;
        }

        /* Common Button Styles */
        button {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--jako-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover { opacity: 0.85; }
        button:active { transform: scale(0.92); }

        .btn-reset-text {
            width: auto;
            padding: 0 0.75rem;
            gap: 0.6rem;
            font-size: clamp(14px, 2.2vw, 18px);
            font-weight: 700;
            letter-spacing: 0.25em;
        }

        .icon-stroke {
            width: clamp(1.4rem, 2.5vw, 1.8rem);
            height: clamp(1.4rem, 2.5vw, 1.8rem);
            stroke: var(--jako-text);
            transition: stroke 0.3s ease;
        }

        button:hover .icon-stroke { stroke: var(--icon-hover); }

        /* ==========================================================================
           3. PROPORTIONAL 6-TIER HEIGHT LAYOUT (10% - 10% - 50% - 10% - 10% - 10%)
           ========================================================================== */
        
        /* Tier 1: Header Bar (10dvh) */
        .header-bar {
            height: 10dvh;
            max-height: 10dvh;
            width: 100%;
            flex-shrink: 0;
        }

        /* Tier 2: Top Information Strip (10dvh) */
        .info-strip-top {
            height: 10dvh;
            max-height: 10dvh;
            width: 100%;
            flex-shrink: 0;
        }

        /* Tier 3: Main Visualizer Stage (50dvh) */
        .main-visualizer-container {
            height: 50dvh;
            max-height: 50dvh;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            flex-shrink: 0;
        }

        /* Tier 4: Bottom Information Strip (10dvh) */
        .info-strip-bottom {
            height: 10dvh;
            max-height: 10dvh;
            width: 100%;
            flex-shrink: 0;
        }

        /* Tier 5: Action Controls Bar (10dvh) */
        .controls-bar {
            height: 10dvh;
            max-height: 10dvh;
            width: 100%;
            flex-shrink: 0;
        }

        /* Tier 6: Footer Container (10dvh) */
        .footer-container {
            height: 10dvh;
            max-height: 10dvh;
            width: 100%;
            flex-shrink: 0;
            background: var(--jako-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 50;
            padding: 0 1.5rem;
            border-top: 1px solid var(--jako-border);
        }

        /* ==========================================================================
           4. VISUALIZER & PACK CONTAINER
           ========================================================================== */
        #fotopanel-pack-container {
            position: relative;
            width: min(85vw, 42dvh);
            height: min(85vw, 42dvh);
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            margin: auto;
            cursor: pointer;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));
            transform-origin: center center;
            will-change: transform;
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 4px;
        }

        #fotopanel-pack-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .panel-back-view {
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .panel-back-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .grayscale-filter {
            filter: grayscale(100%);
        }

        /* ==========================================================================
           5. LAYOUT COMPONENTS & CONTROL GRIDS
           ========================================================================== */
        .info-strip, .footer-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-strip {
            width: 100%;
            color: var(--jako-text);
            font-size: clamp(10px, 1.5vw, 13px);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 0.3rem 1rem;
            gap: 1.5rem;
            z-index: 20;
        }

        .info-strip-content {
            display: flex;
            align-items: center;
            gap: clamp(0.8rem, 2vw, 1.8rem);
            white-space: nowrap;
        }

        .info-item-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .info-item-title {
            font-size: clamp(8px, 1.1vw, 10px);
            opacity: 0.55;
            letter-spacing: 0.15em;
        }

        .info-separator {
            opacity: 0.35;
            font-weight: 300;
            font-size: clamp(12px, 1.8vw, 16px);
        }

        .tele-value { 
            color: var(--jako-text); 
            font-weight: 700;
            text-shadow: var(--jako-led), var(--jako-led);
            transform: translateZ(0);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        /* Action Controls Grid */
        .action-controls-grid {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            padding: 0 0.5rem;
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            background: var(--jako-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            gap: clamp(0.5rem, 2vw, 1.5rem);
        }

        .btn-control-action {
            flex: 1;
            max-width: 4.5rem;
            height: 100%;
            padding: 0.5rem;
        }

        /* Footer Branding */
        .footer-brand-text {
            display: flex;
            align-items: center;
            gap: 0.4em;
            font-size: clamp(9px, 1.3vw, 12px);
            letter-spacing: 0.35em;
            font-weight: 700;
            color: var(--jako-text);
            opacity: 0.5;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
            line-height: 1;
        }

        .footer-copy-symbol {
            font-size: 1.3em;
            line-height: 1;
        }

        .footer-container:hover .footer-brand-text { opacity: 0.95; }
    </style>
</head>
<body>

    <!-- Ambient Background Layers -->
    <div id="page-bg-overlay"></div>
    <div class="ambient-gradient"></div>
        
    <!-- Block 1: Top Action Controls Header (10% Height) -->
    <header class="action-controls-grid header-bar">
        <button class="btn-reset-text" title="Home / Reset" onclick="resetView()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5.5" class="icon-stroke">
                <rect x="4" y="4" width="16" height="16" />
            </svg>
            <span>FOTOPANEL</span>
        </button>
    </header>

    <!-- Block 2: Top Product Spec Strip (10% Height) -->
    <section class="info-strip info-strip-top" aria-label="Service Information">
        <div class="info-strip-content">
            <span class="info-separator">YOUR PRINTING SERVICES</span>
        </div>
    </section>

    <!-- Block 3: Visualizer Stage (50% Height) -->
    <main class="main-visualizer-container">
        <div id="fotopanel-pack-container" onclick="toggleBackView()" title="Click to flip panel view">
            <div class="pack-viewport"></div>
        </div>
    </main>

    <!-- Block 4: Bottom Product Spec Strip (10% Height) -->
    <section class="info-strip info-strip-bottom" aria-label="Product Specifications">
        <div class="info-strip-content">
            <div class="info-item-block">
                <span id="fotopanel-label" class="tele-value">40X40</span>
                <span class="info-item-title">SIZE</span>
            </div>
            
            <span class="info-separator">/</span>
            
            <div class="info-item-block">
                <span id="fotopanel-price" class="tele-value">$40MIL</span>
                <span class="info-item-title">PRICE</span>
            </div>

            <span class="info-separator">/</span>

            <div class="info-item-block">
                <span id="fotopanel-media" class="tele-value">MDF 12MM</span>
                <span class="info-item-title">MEDIA</span>
            </div>
        </div>
    </section>

    <!-- Block 5: Bottom Action Controls Bar (10% Height) -->
    <nav class="action-controls-grid controls-bar" aria-label="Control Actions">
        <input type="file" id="user-image-input" accept="image/*" style="display: none;" onchange="handleUserImageUpload(event)">

        <button id="btn-upload-image" title="Upload Custom Photo" onclick="triggerImageUpload()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="icon-stroke">
                <path d="M4 8V4h16v4" />
                <path d="M12 17V7m0 0l-4 4m4-4l4 4" />
            </svg>
        </button>

        <button id="btn-change-scale" title="Change Scale / Size" onclick="rotateFotoVariant('next')" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-stroke">
                <rect x="5" y="5" width="14" height="14" />
            </svg>
        </button>

        <button id="btn-mode-color" title="Color Mode" onclick="setFotoColorMode(false)" class="btn-control-action">
            <svg viewBox="0 0 24 24" class="icon-stroke">
                <defs>
                    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="25%" stop-color="#ff0000" />
                        <stop offset="50%" stop-color="#ff7f00" />
                        <stop offset="75%" stop-color="#0000ff" />
                        <stop offset="100%" stop-color="#8b00ff" />
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="16" height="16" fill="url(#rainbow-grad)" stroke="none" />
            </svg>
        </button>

        <button id="btn-mode-bw" title="B&W Mode" onclick="setFotoColorMode(true)" class="btn-control-action">
            <svg viewBox="0 0 24 24" class="icon-stroke">
                <defs>
                    <linearGradient id="bw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="16" height="16" fill="url(#bw-grad)" stroke="none" />
            </svg>
        </button>

        <button id="btn-theme-toggle" title="Toggle Theme (Light/Dark)" onclick="toggleTheme()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-stroke">
                <circle cx="12" cy="12" r="5" />
                <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
        </button>

        <button id="btn-activate-node" title="Order via WhatsApp" onclick="acquireNodeCashflow()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="icon-stroke">
                <path d="M4 16v4h16v-4" />
                <path d="M12 7v10m0 0l-4-4m4 4l4-4" />
            </svg>
        </button>
    </nav>

    <!-- Block 6: Footer Bar (10% Height) -->
    <footer class="footer-container">
        <span class="footer-brand-text">
            <span>JAKO.DEV</span>
            <span class="footer-copy-symbol">©</span>
            <span>2026</span>
        </span>
    </footer>

    <!-- Core Logic Engine -->
    <script>
        /**
         * Product catalog specifications data store
         */
        const ARTEPANEL_CATALOG = {
            'PULSOR': {
                defaultVariant: 'PANEL 40X40',
                variants: {
                    'PANEL 20X20': { 
                        label: '20X20CMS', 
                        spec: 'Your photo personalized', 
                        media: 'MDF 12MM',
                        finish: 'ADH INKJET PRINT',
                        price: 'COP$20MIL', 
                        id: 'FP-20X20',
                        scale: 0.65
                    },
                    'PANEL 30X30': { 
                        label: '30X30CMS', 
                        spec: 'Your photo personalized', 
                        media: 'MDF 9MM',
                        finish: 'ADH INKJET PRINT',
                        price: '$30MIL', 
                        id: 'FP-30X30',
                        scale: 0.82
                    },
                    'PANEL 40X40': { 
                        label: '40X40CMS', 
                        spec: 'Your photo personalized', 
                        media: 'MDF 12MM',
                        finish: 'ADH INKJET PRINT',
                        price: '$40MIL', 
                        id: 'FP-40X40',
                        scale: 1.00
                    }
                }
            }
        };

        // Application State
        let currentFotoItem = 'PULSOR';
        let currentFotoVariant = 'PANEL 40X40';
        let isGrayscale = false;
        let isShowingBack = false;
        let activeImageSrc = 'img/photo.png';
        const backImageSrc = 'img/30x30B.png';
        const targetPhoneNumber = "573128707083";

        // DOM Element Cache Map
        const cachedElements = new Map();
        const getCachedEl = (id) => {
            if (!cachedElements.has(id)) {
                cachedElements.set(id, document.getElementById(id));
            }
            return cachedElements.get(id);
        };

        /**
         * Trigger haptic feedback vibration if supported by device
         * @param {number|number[]} pattern - Vibration duration or pattern
         */
        const triggerHaptic = (pattern) => { 
            if (navigator.vibrate) navigator.vibrate(pattern); 
        };

        /**
         * Toggle UI Theme between Dark and Light mode
         */
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', nextTheme);
            localStorage.setItem('fotopanel_theme', nextTheme);
            triggerHaptic(10);
        }

        /**
         * Initialize theme configuration from local storage
         */
        function initTheme() {
            const savedTheme = localStorage.getItem('fotopanel_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        /**
         * Trigger click event on hidden file input element
         */
        function triggerImageUpload() {
            const input = getCachedEl('user-image-input');
            if (input) input.click();
        }

        /**
         * Process user uploaded image file and render to panel
         * @param {Event} event - Input change event
         */
        function handleUserImageUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                activeImageSrc = e.target.result;
                isShowingBack = false;
                updateFotoUI();
                triggerHaptic([10, 20]);
            };
            reader.readAsDataURL(file);
        }

        /**
         * Cycle panel variant size selection
         * @param {string} direction - 'next' or 'prev'
         */
        function rotateFotoVariant(direction = 'next') {
            const variants = Object.keys(ARTEPANEL_CATALOG[currentFotoItem].variants);
            let currentIndex = variants.indexOf(currentFotoVariant);
            
            currentIndex = direction === 'next' 
                ? (currentIndex + 1) % variants.length 
                : (currentIndex - 1 + variants.length) % variants.length;
            
            currentFotoVariant = variants[currentIndex];
            isShowingBack = false;
            updateFotoUI();
            triggerHaptic(15);
        }

        /**
         * Set image surface color mode (Full color / Black & White)
         * @param {boolean} enableBW - True to enable grayscale filter
         */
        function setFotoColorMode(enableBW) {
            isShowingBack = false;
            if (isGrayscale === enableBW) {
                updateFotoUI();
                return;
            }
            isGrayscale = enableBW;
            updateFotoUI();
            triggerHaptic(10);
        }

        /**
         * Toggle visibility of rear surface panel texture
         */
        function toggleBackView() {
            isShowingBack = !isShowingBack;
            const backEl = document.querySelector('.panel-back-view');
            if (backEl) {
                backEl.classList.toggle('active', isShowingBack);
            }
            triggerHaptic(20);
        }

        /**
         * Reset interface state to default settings
         */
        function resetView() {
            currentFotoVariant = 'PANEL 40X40';
            isGrayscale = false;
            isShowingBack = false;
            activeImageSrc = 'img/photo.png';
            const input = getCachedEl('user-image-input');
            if (input) input.value = '';
            
            updateFotoUI();
            triggerHaptic([10, 10]);
        }

        /**
         * Render front/back surface image elements and set scale factor
         * @param {Object} config - Active variant configuration object
         */
        function renderPanelImages(config) {
            const container = getCachedEl('fotopanel-pack-container');
            if (!container) return;

            container.style.transform = `scale(${config.scale})`;

            let viewport = container.querySelector('.pack-viewport');
            if (!viewport) {
                viewport = document.createElement('div');
                viewport.className = 'pack-viewport';
                container.appendChild(viewport);
            }

            const bwClass = isGrayscale ? 'grayscale-filter' : '';
            const backActiveClass = isShowingBack ? 'active' : '';

            viewport.innerHTML = `
                <div style="position: absolute; inset: 0; background-color: #e5e5e5; z-index: 1;"></div>
                <img src="${activeImageSrc}" alt="Panel Surface Front" class="img-glow-transition ${bwClass}" style="z-index: 10;" />
                <img src="${backImageSrc}" alt="Panel Surface Back" class="img-glow-transition panel-back-view ${backActiveClass}" />
            `;
        }

        /**
         * Synchronize UI text labels and images with current catalog state
         */
        function updateFotoUI() {
            const config = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const label = getCachedEl('fotopanel-label');
            const price = getCachedEl('fotopanel-price');
            const media = getCachedEl('fotopanel-media');
            
            if (label) label.textContent = config.label;
            if (price) price.textContent = config.price;
            if (media) media.textContent = config.media;

            renderPanelImages(config);
        }

        /**
         * Build order summary payload and redirect to WhatsApp Web API
         */
        function acquireNodeCashflow() {
            const variant = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const message = [
                `ORDER: ${variant.label}`,
                `VARIANT: ${currentFotoVariant}`,
                `SPEC: ${variant.spec}`,
                `MEDIA: ${variant.media}`,
                `FINISH: ${variant.finish}`,
                `STYLE: ${isGrayscale ? 'Black & White' : 'Color'}`,
                `ID: ${variant.id}`,
                `PRICE: ${variant.price}`
            ].join('\n');

            triggerHaptic([15, 40, 15]);
            window.open(`https://api.whatsapp.com/send?phone=${targetPhoneNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        // Initialize Application on DOM Ready
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateFotoUI();
        });
    </script>
</body>
</html>
