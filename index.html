<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKO VAULT</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS VARIABLES & THEME */
        :root {
            --jako-bg: #f8f9fa;
            --jako-text: #000000;
            --jako-border: rgba(0, 0, 0, 0.12);
            --jako-glass: rgba(255, 255, 255, 0.4);
            --jako-led: rgba(233, 227, 227, 0.455);
            --gradient-start: rgba(0, 0, 0, 0.02);
            --gradient-mid: rgba(248, 249, 250, 0.85);
            --gradient-end: #ffffff;
            --icon-hover: #b6b8b9;
        }

        /* GLOBAL RESET & BASE STYLES */
        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: inherit;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
        }

        body { 
            font-family: 'Orbitron', monospace, sans-serif; 
            background-color: var(--jako-bg); 
            color: var(--jako-text); 
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            transition: background-color 0.5s ease, color 0.5s ease;
        } 

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        button, span, div { -webkit-tap-highlight-color: transparent; }

        /* AMBIENT OVERLAYS */
        #page-bg-overlay, .ambient-gradient {
            position: fixed;
            inset: 0;
        }

        #page-bg-overlay {
            background: radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
            will-change: background;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ambient-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
            z-index: 0;
            pointer-events: none;
        }

        /* TRANSITIONS */
        .img-glow-transition {
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: filter, transform, opacity;
        }

        .info-strip, .action-controls-grid, footer, #fotopanel-pack-container {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease, border-color 0.5s ease;
        }

        /* BUTTONS & ICONS */
        .btn-tele-glass {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--jako-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-tele-glass:hover { opacity: 0.8; }
        .btn-tele-glass:active { transform: scale(0.92); }

        .btn-reset-text {
            width: auto;
            padding: 0 0.5rem;
            gap: 0.5rem;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.25em;
        }

        .icon-tele, .icon-stroke {
            width: 1rem;
            height: 1rem;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        .icon-tele {
            fill: var(--jako-text);
            pointer-events: none;
        }

        .icon-stroke { stroke: var(--jako-text); }
        .btn-tele-glass:hover .icon-tele { fill: var(--icon-hover); }
        .btn-tele-glass:hover .icon-stroke { stroke: var(--icon-hover); }

        /* VISUALIZER STAGE & CONTAINERS */
        .main-visualizer-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            position: relative;
            overflow: hidden;
            transition: padding 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #fotopanel-pack-container {
            position: relative;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            margin: auto;
            cursor: pointer;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.6));
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #fotopanel-pack-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* PRODUCT SPEC STRIP */
        .info-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            color: var(--jako-text);
            font-size: 8px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            gap: 0.5rem;
            z-index: 20;
        }

        .info-strip-content {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .info-separator {
            opacity: 0.4;
            font-weight: 300;
        }

        .tele-value { 
            color: var(--jako-text); 
            text-shadow: var(--jako-led), var(--jako-led);
            transform: translateZ(0);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        /* ACTION CONTROLS BAR */
        .action-controls-grid {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
            height: 3rem;
            padding: 0 0.5rem;
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
            transition: background 0.5s ease, border-color 0.5s ease, opacity 0.5s ease, transform 0.5s ease;
        }

        .action-controls-grid .btn-tele-glass {
            height: 100%;
        }

        /* FOOTER (RIGHT-ALIGNED) */
        .footer-container {
            height: 50px;
            width: 100%;
            flex-shrink: 0;
            background: var(--jako-glass);
            backdrop-filter: blur(10px);
            z-index: 50;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            border-top: 1px solid var(--jako-border);
        }

        .footer-brand-text {
            display: flex;
            align-items: center;
            gap: 0.35em;
            font-size: 8px;
            letter-spacing: 0.35em;
            font-weight: 700;
            color: var(--jako-text);
            opacity: 0.5;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
            line-height: 1;
        }

        .footer-copy-symbol {
            font-size: 1.5em;
            line-height: 1;
        }

        .footer-container:hover .footer-brand-text { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="page-bg-overlay"></div>
    <div class="ambient-gradient"></div>
        
    <!-- Top Action Controls -->
    <div class="action-controls-grid">
        <button class="btn-tele-glass btn-reset-text" title="Home / Reset" onclick="resetView()">
            <span>FOTOPANEL</span>
            <svg viewBox="0 0 100 100" class="icon-tele">
                <polygon points="80,20 80,80 65,70 65,30" />
                <polygon points="58,50 50,58 42,50 50,42" />
            </svg>
        </button>
    </div>

    <!-- Visualizer Stage -->
    <main class="main-visualizer-container">
        <div id="fotopanel-pack-container">
            <div class="pack-viewport"></div>
        </div>

        <!-- Product Spec Strip -->
        <div class="info-strip">
            <div class="info-strip-content">
                <span id="fotopanel-label" class="tele-value">40X40</span>
                <span class="info-separator">/</span>
                <span id="fotopanel-price" class="tele-value">$40MIL</span>
            </div>

            <button id="btn-activate-node" title="Order via WhatsApp" onclick="acquireNodeCashflow()" class="btn-tele-glass" style="width: auto; padding: 0.5rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M12 3v13.5m0 0l-4.5-4.5M12 16.5l4.5-4.5" />
                </svg>
            </button>
        </div>
    </main>
 
    <!-- Bottom Action Controls -->
    <div class="action-controls-grid">
        <button id="btn-next-variant" title="Next Variant Scale" onclick="rotateFotoVariant('next')" class="btn-tele-glass" style="width: 3rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4M9 9h6v6H9z" />
            </svg>
        </button>
    </div>

    <!-- Footer -->
    <footer class="footer-container">
        <span class="footer-brand-text">
            <span>2026</span>
            <span class="footer-copy-symbol">©</span>
        </span>
    </footer>

    <!-- Core Logic Engine -->
    <script>
        const ARTEPANEL_CATALOG = {
            'PULSOR': {
                defaultVariant: 'PANEL 20X20',
                variants: {
                    'PANEL 20X20': { 
                        label: '20X20CMS', 
                        spec: 'Your photo personalized', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$20MIL', 
                        id: 'FP-20X20',
                        img: 'img/20x20.png', 
                        imgBack: 'img/40x40B.png'
                    },
                    'PANEL 30X30': { 
                        label: '30X30CMS', 
                        spec: 'Your photo personalized', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$30MIL', 
                        id: 'FP-30X30',
                        img: 'img/30x30.png', 
                        imgBack: 'img/40x40B.png'
                    },
                    'PANEL 40X40': { 
                        label: '40X40CMS', 
                        spec: 'Your photo personalized', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$40MIL', 
                        id: 'FP-40X40',
                        img: 'img/40x40.png', 
                        imgBack: 'img/40x40B.png'
                    }
                }
            }
        };

        let currentFotoItem = 'PULSOR';
        let currentFotoVariant = 'PANEL 20X20';
        const targetPhoneNumber = "573128707083";

        const cachedElements = {};
        const getCachedEl = (id) => cachedElements[id] || (cachedElements[id] = document.getElementById(id));

        const triggerHaptic = (pattern) => { 
            if (navigator.vibrate) navigator.vibrate(pattern); 
        };

        function rotateFotoVariant(direction = 'next') {
            const variants = Object.keys(ARTEPANEL_CATALOG[currentFotoItem].variants);
            let currentIndex = variants.indexOf(currentFotoVariant);
            
            currentIndex = direction === 'next' 
                ? (currentIndex + 1) % variants.length 
                : (currentIndex - 1 + variants.length) % variants.length;
            
            currentFotoVariant = variants[currentIndex];
            updateFotoUI();
            triggerHaptic(15);
        }

        function resetView() {
            currentFotoVariant = 'PANEL 40X40';
            updateFotoUI();
            triggerHaptic([10, 10]);
        }

        function renderPanelImages(config) {
            const container = getCachedEl('fotopanel-pack-container');
            if (!container) return;

            let viewport = container.querySelector('.pack-viewport');
            if (!viewport) {
                viewport = document.createElement('div');
                viewport.className = 'pack-viewport';
                container.appendChild(viewport);
            }

            viewport.innerHTML = `
                <img src="${config.imgBack}" alt="Panel Base" style="z-index: 5;" />
                <img src="${config.img}" alt="Panel Surface" class="img-glow-transition" style="z-index: 10;" />
            `;
        }

        function updateFotoUI() {
            const config = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const label = getCachedEl('fotopanel-label');
            const price = getCachedEl('fotopanel-price');
            
            if (label) label.textContent = config.label;
            if (price) price.textContent = config.price;

            renderPanelImages(config);
        }

        function acquireNodeCashflow() {
            const variant = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const message = [
                `ORDER: ${variant.label}`,
                `VARIANT: ${currentFotoVariant}`,
                `SPEC: ${variant.spec}`,
                `MEDIA: ${variant.media}`,
                `FINISH: ${variant.finish}`,
                `ID: ${variant.id}`,
                `PRICE: ${variant.price}`
            ].join('\n');

            triggerHaptic([15, 40, 15]);
            window.open(`https://api.whatsapp.com/send?phone=${targetPhoneNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', updateFotoUI);
    </script>
</body>
</html>
