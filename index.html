<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOTOPANEL.ART</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS VARIABLES & THEME CONFIGURATION */
        :root[data-theme="dark"] {
            --jako-bg: #121212;
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.15);
            --jako-glass: rgba(30, 30, 30, 0.6);
            --jako-led: rgba(255, 255, 255, 0.6);
            --gradient-start: rgba(255, 255, 255, 0.05);
            --gradient-mid: rgba(18, 18, 18, 0.85);
            --gradient-end: #121212;
            --icon-hover: #ffffff;
            --toggle-handle-transform: translateX(0px);
        }

        :root[data-theme="light"] {
            --jako-bg: #f8f9fa;
            --jako-text: #000000;
            --jako-border: rgba(0, 0, 0, 0.12);
            --jako-glass: rgba(255, 255, 255, 0.4);
            --jako-led: rgba(0, 0, 0, 0.3);
            --gradient-start: rgba(0, 0, 0, 0.02);
            --gradient-mid: rgba(248, 249, 250, 0.85);
            --gradient-end: #ffffff;
            --icon-hover: #666666;
            --toggle-handle-transform: translateX(26px);
        }

        /* GLOBAL RESET & BASE STYLES */
        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: inherit;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
        }

        body { 
            font-family: 'Orbitron', monospace, sans-serif; 
            background-color: var(--jako-bg); 
            color: var(--jako-text); 
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            position: relative;
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            transition: background-color 0.5s ease, color 0.5s ease;
        } 

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        button, span, div { -webkit-tap-highlight-color: transparent; }

        /* AMBIENT BACKGROUND OVERLAYS */
        #page-bg-overlay, .ambient-gradient {
            position: fixed;
            inset: 0;
        }

        #page-bg-overlay {
            background: radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
            will-change: background;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ambient-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
            z-index: 0;
            pointer-events: none;
        }

        /* GLOBAL TRANSITION SELECTOR */
        .img-glow-transition, .info-strip, footer, #fotopanel-pack-container, .panel-back-view {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease, border-color 0.5s ease;
        }

        /* GLASS BUTTONS & COMMON BUTTON STYLES */
        button {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--jako-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover { opacity: 0.8; }
        button:active { transform: scale(0.92); }

        .btn-reset-text {
            width: auto;
            padding: 0 0.5rem;
            gap: 0.5rem;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.25em;
        }

        .icon-stroke { 
            width: 1.2rem;
            height: 1.2rem;
            stroke: var(--jako-text);
            transition: stroke 0.3s ease;
        }

        button:hover .icon-stroke { stroke: var(--icon-hover); }

        /* LAYOUT HEIGHT TIERS */
        .header-bar {
            height: 10dvh;
            max-height: 10dvh;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 1rem;
            position: relative;
            z-index: 100;
            border-bottom: 1px solid var(--jako-border);
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
        }

        .info-strip-top {
            height: 5dvh;
            max-height: 5dvh;
            flex-shrink: 0;
        }

        .main-visualizer-container {
            height: 65dvh;
            max-height: 65dvh;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .info-strip-bottom {
            height: 5dvh;
            max-height: 5dvh;
            flex-shrink: 0;
        }

        .controls-bar {
            height: 10dvh;
            max-height: 10dvh;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 0.5rem;
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
            gap: 1.5rem;
        }

        .footer-container {
            height: 5dvh;
            max-height: 5dvh;
            width: 100%;
            flex-shrink: 0;
            background: var(--jako-glass);
            backdrop-filter: blur(10px);
            z-index: 50;
            padding: 0 1.5rem;
            border-top: 1px solid var(--jako-border);
        }

        /* MAIN VISUALIZER CONTAINER & INLINE OVERLAY BUTTONS */
        #fotopanel-pack-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            max-height: 55dvh;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            margin: auto;
            cursor: pointer;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.6));
            transform-origin: center center;
        }

        /* SHARED OVERLAY BUTTON BASE STYLING */
        .btn-overlay-action {
            position: absolute;
            z-index: 30;
            width: 2.2rem;
            height: 2.2rem;
            background: var(--jako-glass);
            border: 1px solid var(--jako-border);
            border-radius: 4px;
            backdrop-filter: blur(10px);
            padding: 0.2rem;
        }

        /* SPECIFIC OVERLAY POSITIONS */
        .btn-overlay-top-left {
            top: 8px;
            left: 8px;
        }

        .btn-overlay-bottom-left {
            bottom: 8px;
            left: 8px;
        }

        .btn-overlay-bottom-right {
            bottom: 8px;
            right: 8px;
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* SURFACE IMAGES STYLING */
        .user-surface-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            will-change: transform;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #fotopanel-pack-container img.panel-back-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .panel-back-view {
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .panel-back-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .grayscale-filter {
            filter: grayscale(100%);
        }

        .info-strip, .footer-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-strip {
            width: 100%;
            color: var(--jako-text);
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 0.8rem 2rem;
            gap: 1.5rem;
            z-index: 20;
        }

        .info-strip-content {
            display: flex;
            align-items: center;
            gap: 1rem;
            white-space: nowrap;
        }

        .info-item-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }

        .info-item-title {
            font-size: 7px;
            opacity: 0.5;
            letter-spacing: 0.15em;
        }

        .info-separator {
            opacity: 0.4;
            font-weight: 300;
        }

        .tele-value { 
            color: var(--jako-text); 
            text-shadow: var(--jako-led), var(--jako-led);
            transform: translateZ(0);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .btn-control-action {
            width: 3.8rem !important;
            height: 100%;
        }

        /* ACROMATIC SWITCH TOGGLE */
        .toggle-handle {
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform: var(--toggle-handle-transform);
        }

        /* FOOTER BRANDING */
        .footer-brand-text {
            display: flex;
            align-items: center;
            gap: 0.35em;
            font-size: 7px;
            letter-spacing: 0.35em;
            font-weight: 700;
            color: var(--jako-text);
            opacity: 0.5;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
            line-height: 1;
        }

        .footer-copy-symbol {
            font-size: 1.5em;
            line-height: 1;
        }

        .footer-container:hover .footer-brand-text { opacity: 0.9; }

        /* RESPONSIVE MEDIA QUERIES */
        @media (max-height: 667px) {
            .btn-reset-text { font-size: 10px; }
            .icon-stroke { width: 1.1rem; height: 1.1rem; }
            .info-strip { font-size: 7px; gap: 0.4rem; }
            .info-strip-content { gap: 0.4rem; }
            .info-item-title { font-size: 6px; }
            #fotopanel-pack-container { max-height: 48dvh; }
            .controls-bar { 
                gap: 0.5rem; 
                margin-bottom: 0.4rem;
            }
            .btn-control-action { width: 2rem !important; }
        }
    </style>
</head>
<body>

    <div id="page-bg-overlay"></div>
    <div class="ambient-gradient"></div>
        
    <header class="header-bar">
        <div></div>
        <button class="btn-reset-text" title="Home / Reset" onclick="resetView()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5.5" class="icon-stroke">
                <rect x="4" y="4" width="16" height="16" />
            </svg>
            <span>FOTOPANEL</span>
        </button>
        <div></div>
    </header>

    <div class="info-strip info-strip-top">
        <div class="info-strip-content">
            <span id="top-strip-text" class="info-separator">IMAGINA • ENFOCA • PROYECTA</span>
        </div>
    </div>

<main class="main-visualizer-container">
        <div id="fotopanel-pack-container">
            <button id="btn-upload-image" title="Upload Custom Photo" onclick="triggerImageUpload()" class="btn-overlay-action btn-overlay-bottom-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                    <path d="M4 8V4h16v4" />
                    <path d="M12 17V7m0 0l-4 4m4-4l4 4" />
                </svg>
            </button>

            <button id="btn-activate-node" title="Order via WhatsApp" onclick="acquireNodeCashflow()" class="btn-overlay-action btn-overlay-bottom-right" style="width: auto; height: 2.2rem; padding: 0 0.6rem; gap: 0.4rem; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; letter-spacing: 0.05em;">
                <span class="info-item-title" style="opacity: 0.7; font-size: 9px;">COP$</span>
                <span id="fotopanel-price" class="tele-value" style="font-size: 11px;">40MIL</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke" style="width: 1rem; height: 1rem; margin-left: 0.2rem;">
                    <path d="M6 9V4h12v5" />
                    <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2" />
                    <path d="M6 14h12v6H6z" />
                </svg>
            </button>
            
            <div class="pack-viewport"></div>
        </div>
    </main>

    <div class="info-strip info-strip-bottom">
        <div class="info-strip-content">
            <div class="info-item-block">
                <span id="fotopanel-label" class="tele-value">40X40</span>
                <span class="info-item-title">CMS</span>
            </div>
            
            <span class="info-separator">/</span>

            <div class="info-item-block">
                <span id="fotopanel-finish" class="tele-value">ADH INKJET PRINT</span>
                <span id="lbl-printing-media" class="info-item-title">SOPORTE MDF 9MM</span>
            </div>
        </div>
    </div>

<div class="controls-bar">
        <input type="file" id="user-image-input" accept="image/*" style="display: none;" onchange="handleUserImageUpload(event)">

        <button id="btn-change-scale" title="Change Scale / Size" onclick="rotateFotoVariant('next')" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-stroke">
                <rect x="5" y="5" width="14" height="14" />
            </svg>
        </button>

        <button id="btn-color-toggle" title="Toggle Color / B&W Mode" onclick="toggleFotoColorMode()" class="btn-control-action">
            <svg viewBox="0 0 24 24" class="icon-stroke">
                <defs>
                    <linearGradient id="color-bw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff6600" />
                        <stop offset="33%" stop-color="#0000ff" />
                        <stop offset="66%" stop-color="#ffffff" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="16" height="16" fill="url(#color-bw-grad)" stroke="none" />
            </svg>
        </button>

        <button id="btn-crop-zoom" title="Toggle Scale Zoom" onclick="toggleCropZoom()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <path d="M6 2v14a2 2 0 002 2h14" />
                <path d="M18 22V8a2 2 0 00-2-2H2" />
            </svg>
        </button>

        <button id="acromatic-toggle-trigger" title="Toggle Theme" onclick="toggleTheme()" class="btn-control-action" style="background: none; border: none; padding: 0;">
            <svg style="width: 32px; height: auto; display: block;" viewBox="0 0 54 28">
                <rect width="54" height="28" rx="14" fill="var(--jako-text)" opacity="0.4" />
                <g class="toggle-handle">
                    <circle cx="14" cy="14" r="10" fill="var(--jako-bg)" />
                </g>
            </svg>
        </button>
    </div>

    <footer class="footer-container">
        <a href="https://jako.world" target="_blank" rel="noopener noreferrer" class="footer-brand-text" style="text-decoration: none; color: inherit;">
            <span>JAKO.DEV</span>
            <span class="footer-copy-symbol">©</span>
            <span>2026</span>
        </a>
    </footer>

    <script>
        // Product Catalog Specifications
        const ARTEPANEL_CATALOG = {
            'PULSOR': {
                defaultVariant: 'PANEL 40X40',
                variants: {
                    'PANEL 20X20': { 
                        label: '20X20', 
                        media: 'MDF 12MM',
                        finish: 'ADH INKJET PRINT',
                        price: '20MIL', 
                        id: 'FP-20X20',
                        scale: 0.50
                    },
                    'PANEL 30X30': { 
                        label: '30X30', 
                        media: 'MDF 9MM',
                        finish: 'ADH INKJET PRINT',
                        price: '30MIL', 
                        id: 'FP-30X30',
                        scale: 0.75
                    },
                    'PANEL 40X40': { 
                        label: '40X40', 
                        media: '9MM',
                        finish: 'ADH INKJET PRINT',
                        price: '40MIL', 
                        id: 'FP-40X40',
                        scale: 1.00
                    }
                }
            }
        };

        // Global State
        let currentFotoItem = 'PULSOR';
        let currentFotoVariant = 'PANEL 40X40';
        let isGrayscale = false;
        let isShowingBack = false;
        let isZoomed = false;

        let activeImageSrc = 'img/photo.png';
        const backImageSrc = 'img/30x30B.png';
        const targetPhoneNumber = "573128707083";

        // DOM Cache Helper
        const cachedElements = {};
        const getCachedEl = (id) => cachedElements[id] || (cachedElements[id] = document.getElementById(id));

        // Haptic Feedback Trigger
        const triggerHaptic = (pattern) => { 
            if (navigator.vibrate) navigator.vibrate(pattern); 
        };

        // Toggle UI Theme (Dark / Light)
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', nextTheme);
            localStorage.setItem('fotopanel_theme', nextTheme);
            triggerHaptic(10);
        }

        // Initialize Theme from LocalStorage
        function initTheme() {
            const savedTheme = localStorage.getItem('fotopanel_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // Trigger Hidden File Upload Input
        function triggerImageUpload() {
            const input = getCachedEl('user-image-input');
            if (input) input.click();
        }

        // Handle Custom User Image Upload
        function handleUserImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                activeImageSrc = e.target.result;
                isShowingBack = false;
                isZoomed = false;
                updateFotoUI();
                triggerHaptic([10, 20]);
            };
            reader.readAsDataURL(file);
        }

        // Toggle Image Scale Zoom
        function toggleCropZoom() {
            isZoomed = !isZoomed;
            applyImageTransform();
            triggerHaptic(10);
        }

        // Apply Scale Transforms to Front Surface Image
        function applyImageTransform() {
            const img = document.querySelector('.user-surface-image');
            if (img) {
                const scale = isZoomed ? 1.25 : 1.0;
                img.style.transform = `scale(${scale})`;
            }
        }

        // Cycle Panel Variants (Sizes) & Reset Back View
        function rotateFotoVariant(direction = 'next') {
            const variants = Object.keys(ARTEPANEL_CATALOG[currentFotoItem].variants);
            let currentIndex = variants.indexOf(currentFotoVariant);
            
            currentIndex = direction === 'next' 
                ? (currentIndex + 1) % variants.length 
                : (currentIndex - 1 + variants.length) % variants.length;
            
            currentFotoVariant = variants[currentIndex];
            isShowingBack = false;
            updateFotoUI();
            triggerHaptic(15);
        }

        // Toggle Color vs Grayscale Mode
        function toggleFotoColorMode() {
            isShowingBack = false;
            isGrayscale = !isGrayscale;
            updateFotoUI();
            triggerHaptic(10);
        }

        // Toggle Back Surface PNG Visibility
        function toggleBackView() {
            isShowingBack = !isShowingBack;
            const backEl = document.querySelector('.panel-back-view');
            if (backEl) {
                backEl.classList.toggle('active', isShowingBack);
            }
            triggerHaptic(20);
        }

        // Reset View to Initial Application State
        function resetView() {
            currentFotoVariant = 'PANEL 40X40';
            isGrayscale = false;
            isShowingBack = false;
            isZoomed = false;
            activeImageSrc = 'img/photo.png';
            const input = getCachedEl('user-image-input');
            if (input) input.value = '';
            
            updateFotoUI();
            triggerHaptic([10, 10]);
        }

        // Render Surface Images & Update Container Scaling
        function renderPanelImages(config) {
            const container = getCachedEl('fotopanel-pack-container');
            if (!container) return;

            container.style.transform = `scale(${config.scale})`;

            let viewport = container.querySelector('.pack-viewport');
            if (!viewport) {
                viewport = document.createElement('div');
                viewport.className = 'pack-viewport';
                container.appendChild(viewport);
            }

            const bwClass = isGrayscale ? 'grayscale-filter' : '';
            const backActiveClass = isShowingBack ? 'active' : '';

            viewport.innerHTML = `
                <div style="position: absolute; inset: 0; background-color: #e5e5e5; z-index: 1;"></div>
                <img src="${activeImageSrc}" alt="Panel Surface Front" class="user-surface-image img-glow-transition ${bwClass}" style="z-index: 10;" />
                <img src="${backImageSrc}" alt="Panel Surface Back" class="img-glow-transition panel-back-view ${backActiveClass}" onclick="toggleBackView()" />
            `;

            applyImageTransform();
        }

        // Synchronize UI Elements with Catalog State
        function updateFotoUI() {
            const config = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const label = getCachedEl('fotopanel-label');
            const price = getCachedEl('fotopanel-price');
            const media = getCachedEl('lbl-printing-media');
            const finish = getCachedEl('fotopanel-finish');
            
            if (label) label.textContent = config.label;
            if (price) price.textContent = config.price;
            if (media) media.textContent = `SOPORTE ${config.media}`;
            if (finish) finish.textContent = config.finish;

            renderPanelImages(config);
        }

        // Handle Commercial WhatsApp Checkout Action
        function acquireNodeCashflow() {
            const variant = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const styleText = isGrayscale ? 'Adh ikjet print b/w' : 'Adh inkjet print full color';
            
            const message = `¡Hola! Quiero hacer un pedido de un FotoPanel personalizado \n\n` +
                `• Tamaño: ${variant.label} cms\n` +
                `• Medio: ${styleText}\n` +
                `• Soporte: MDF ${variant.media}\n` +
                `• Precio: ${variant.price} COP\n\n` +
                `¿Cuáles son los pasos para enviar la foto y acordar el pago?`;

            triggerHaptic([15, 40, 15]);
            window.open(`https://api.whatsapp.com/send?phone=${targetPhoneNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        // DOM Content Loaded Initializer
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateFotoUI();
        });
    </script>
</body>
</html>
