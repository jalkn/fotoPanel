<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOTOPANEL.ART</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* VARIABLES ACROMÁTICAS DE ENTORNO MATRICIAL */
        :root[data-theme="dark"] {
            --jako-bg: #020617;
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.12);
            --jako-glass: rgba(0, 0, 0, 0.5);
            --jako-led: rgba(255, 255, 255, 0.65);
            --gradient-start: rgba(30, 58, 138, 0.4);
            --gradient-mid: #0f172a;
            --gradient-end: #020617;
            --icon-hover: #b6b8b9;
        }

        :root[data-theme="white"] {
            --jako-bg: #f8f9fa;
            --jako-text: #050508;
            --jako-border: rgba(0, 0, 0, 0.12);
            --jako-glass: rgba(255, 255, 255, 0.6);
            --jako-led: rgba(0, 0, 0, 0.75);
            --gradient-start: rgba(224, 242, 254, 0.8);
            --gradient-mid: #e2e8f0;
            --gradient-end: #f8f9fa;
            --icon-hover: #b6b8b9;
        }

        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        /* MOTOR BASE DE LA INTERFAZ */
        body { 
            font-family: 'Orbitron', monospace, sans-serif; 
            background-color: var(--jako-bg); 
            color: var(--jako-text); 
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth; 
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            transition: background-color 0.5s ease, color 0.5s ease;
        } 

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        /* AMBIENT OVERLAYS */
        #page-bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
            will-change: background;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ambient-gradient {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
            z-index: 0;
            pointer-events: none;
        }

        /* TRANSICIÓN DE GLOW SIN SALTOS ÓPTICOS */
        .img-glow-transition {
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: filter, transform, opacity;
        }

        /* HEADER BAR & GLASS SYSTEM */
        .header-container {
            width: 100%;
            flex-shrink: 0;
            z-index: 50;
            background: var(--jako-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--jako-border);
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, border-color 0.5s ease;
        }

        /* CONTROLES TELESCOPICOS (BUTTONS) */
        .btn-tele-glass {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            color: var(--jako-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-tele-glass:hover {
            opacity: 0.8;
        }

        .btn-tele-glass:active {
            transform: scale(0.92);
        }

        .tele-btn-left {
            height: 100%;
            padding: 0 0.5rem;
            justify-content: flex-start;
        }

        .tele-btn-center {
            width: 3rem;
            height: 3rem;
            flex-shrink: 0;
            justify-content: center;
        }

        .tele-btn-right {
            height: 100%;
            padding: 0 0.5rem;
            justify-content: flex-end;
        }

        .icon-tele {
            width: 1rem;
            height: 1rem;
            fill: var(--jako-text);
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .icon-stroke {
            width: 1rem;
            height: 1rem;
            stroke: var(--jako-text);
            transition: stroke 0.3s ease;
        }

        .btn-tele-glass:hover .icon-tele {
            fill: var(--icon-hover);
        }

        .btn-tele-glass:hover .icon-stroke {
            stroke: var(--icon-hover);
        }

        /* VISUALIZER STAGE */
        .main-visualizer-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            transition: padding 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #fotopanel-pack-container {
            position: relative;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            margin: 0 auto;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.6));
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease;
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #fotopanel-pack-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* PRODUCT LABELS & STRIPS */
        .info-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--jako-text);
            font-size: 8px;
            letter-spacing: 0.25em;
            width: 100%;
            text-transform: uppercase;
            padding-top: 0.25rem;
            gap: 0.5rem;
        }

        .info-strip-content {
            width: 100%;
            padding: 0.375rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* EFECTO LED DINÁMICO DE TEXTO */
        .tele-value { 
            color: var(--jako-text); 
            text-shadow: 0 0 14px var(--jako-led), 0 0 4px var(--jako-led);
            transform: translateZ(0);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        /* ACTION CONTROLS GRID */
        .action-controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            align-items: center;
            width: 100%;
            padding: 0 1rem;
            height: 3rem;
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: background 0.5s ease, border-color 0.5s ease;
        }

        .action-controls-grid .btn-tele-glass {
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* FOOTER */
        .footer-container {
            height: 50px;
            width: 100%;
            flex-shrink: 0;
            background: var(--jako-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 50;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid var(--jako-border);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.5s ease;
        }

        .footer-brand-text {
            font-size: 6px;
            letter-spacing: 0.35em;
            font-weight: 700;
            color: var(--jako-text);
            opacity: 0.5;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
        }

        .footer-container:hover .footer-brand-text {
            opacity: 0.9;
        }

        .custom-hud-scroll { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        .custom-hud-scroll::-webkit-scrollbar { 
            display: none; 
            width: 0 !important;
            height: 0 !important;
        }

        button, span, div {
            -webkit-tap-highlight-color: transparent;
        }

        .zenith-active header,
        .zenith-active footer {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(-10px);
        }

        .zenith-active footer {
            transform: translateY(10px);
        }

        .zenith-active main {
            padding: 0 !important;
        }

        .zenith-active #fotopanel-pack-container {
            transform: scale(1.12);
            filter: drop-shadow(0 35px 80px rgba(0,0,0,0.95));
        }

        header, footer, #fotopanel-pack-container {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease;
        }

        .header-controls-centered {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 3rem;
            padding: 0 1rem;
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            transition: background 0.5s ease, border-color 0.5s ease;
        }

        .header-controls-centered .btn-tele-glass {
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 0 1rem;
        }
    </style>
</head>
<body>

    <div id="page-bg-overlay"></div>
    <div class="ambient-gradient"></div>
        
<!-- Header Controls Centered -->
<header class="header-controls-centered">
    <button class="btn-tele-glass">
        <svg viewBox="0 0 100 100" class="icon-tele">
            <polygon points="80,20 80,80 65,70 65,30" />
            <polygon points="58,50 50,58 42,50 50,42" />
            <polygon points="35,30 35,70 20,80 20,20" />
        </svg>
    </button>
</header>

    <div class="info-strip">
        <div class="info-strip-content">
            <span id="fotopanel-label" class="tele-value">PULSOR PANEL 40X40</span>
        </div>
    </div>

    <!-- Visualizer Stage -->
    <main class="main-visualizer-container">
        <div id="fotopanel-pack-container">
            <div class="pack-viewport">
                <img id="fotopanel-pack-img-back" src="img/20x20B.png" alt="Pulsor Back" class="img-glow-transition" style="opacity: 0; pointer-events: none; z-index: 0;" />
                <img id="fotopanel-pack-img" src="img/surface.png" alt="Pulsor Front" class="img-glow-transition" style="opacity: 1; pointer-events: auto; z-index: 10;" />
                <img id="fotopanel-pack-img-raw" src="img/panel40B.png" alt="Raw View" class="img-glow-transition" style="opacity: 0; pointer-events: none; z-index: 5;" />
            </div>
        </div>
    </main>

    <!-- Pricing Strip -->
    <div class="info-strip">
        <div class="info-strip-content">
            <span id="fotopanel-price" class="tele-value">$55USD</span>
        </div>
    </div>

    <!-- Action Dispatcher Bar (Incluye Interruptor Acromático) -->
    <div class="action-controls-grid">
        <button id="btn-reveal-bio" title="Inspect" class="btn-tele-glass">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="icon-stroke">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </button>

        <button id="acromatic-toggle-trigger" title="Toggle Theme" class="btn-tele-glass">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="icon-stroke">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21m8.966-8.966h-2.25M4.284 12h-2.25m15.356-6.364l-1.591 1.591M6.364 17.636l-1.591 1.591m12.728 0l-1.591-1.591M6.364 6.364L4.773 4.773M12 8.25a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z" />
            </svg>
        </button>

        <button id="btn-activate-node" title="Acquire Node" onclick="acquireNodeCashflow()" class="btn-tele-glass">
            <svg viewBox="0 0 100 100" class="icon-tele">
                <polygon points="20,20 80,20 70,35 30,35" />
                <polygon points="50,42 58,50 50,58 42,50" />
                <polygon points="30,65 70,65 80,80 20,80" />
            </svg>
        </button>

        <button id="btn-next-variant" title="Next Variant" onclick="rotateFotoVariant('next')" class="btn-tele-glass">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" class="icon-stroke">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
        </button>
    </div>

    <!-- Footer -->
    <footer class="footer-container">
        <span class="footer-brand-text">POWERED BY JAKO.DEV</span>
    </footer>

    <!-- Core Logic Engine -->
    <script>
        // Catalog Configuration Schema
        const ARTEPANEL_CATALOG = {
            'PULSOR': {
                defaultVariant: 'PANEL 40X40',
                variants: {
                    'PANEL 20X20': { 
                        label: 'FOTOPANEL 20X20', 
                        spec: 'Community Mural Funding', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$20MIL', 
                        id: 'FP-20X20',
                        img: 'img/surface.png', 
                        imgBack: 'img/20x20B.png', 
                        imgRaw: 'img/panel20B.png'
                    },
                    'PANEL 30X30': { 
                        label: 'FOTOPANEL 30X30', 
                        spec: 'Community Mural Funding', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$30MIL', 
                        id: 'FP-30X30',
                        img: 'img/surface.png', 
                        imgBack: 'img/panel30W.png', 
                        imgRaw: 'img/panel30B.png'
                    },
                    'PANEL 40X40': { 
                        label: 'FOTOPANEL 40X40', 
                        spec: 'Community Mural Funding', 
                        media: 'ACM 3mm',
                        finish: 'Matte Lamination Inkjet',
                        price: '$40MIL', 
                        id: 'FP-40X40',
                        img: 'img/surface.png', 
                        imgBack: 'img/panel40W.png', 
                        imgRaw: 'img/panel40B.png'
                    }
                }
            }
        };

        // Core Application State
        let currentFotoItem = 'PULSOR';
        let currentFotoVariant = 'PANEL 40X40';
        let inspectModeIndex = 0;
        const targetPhoneNumber = "573128707083";

        // Element Cache Registry
        const $ = (id) => document.getElementById(id);
        const cachedElements = {};
        const getCachedEl = (id) => cachedElements[id] || (cachedElements[id] = $(id));

        // Haptic Feedback Trigger
        const triggerHaptic = (pattern) => { 
            if (navigator.vibrate) navigator.vibrate(pattern); 
        };

        // Visual Inspector Switcher (Front, Back, Raw)
        function applyVisualMode(mode) {
            const layers = [
                { el: getCachedEl('fotopanel-pack-img'), mode: 'front', index: 0 },
                { el: getCachedEl('fotopanel-pack-img-back'), mode: 'back', index: 1 },
                { el: getCachedEl('fotopanel-pack-img-raw'), mode: 'raw', index: 2 }
            ];

            layers.forEach(({ el, mode: m, index }) => {
                if (!el) return;
                const isActive = (m === mode);
                el.style.opacity = isActive ? '1' : '0';
                el.style.zIndex = isActive ? '10' : '0';
                if (isActive) inspectModeIndex = index;
            });
        }

        // Rotate Active Catalog Variant
        function rotateFotoVariant(direction = 'next') {
            const variants = Object.keys(ARTEPANEL_CATALOG[currentFotoItem].variants);
            const currIdx = variants.indexOf(currentFotoVariant);
            const nextIdx = (direction === 'next') 
                ? (currIdx + 1) % variants.length 
                : (currIdx - 1 + variants.length) % variants.length;
            
            currentFotoVariant = variants[nextIdx];
            updateFotoUI();
            triggerHaptic(12);
        }

        // Sync UI Elements with Active Variant Data
        function updateFotoUI() {
            const config = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            
            const front = getCachedEl('fotopanel-pack-img');
            const back = getCachedEl('fotopanel-pack-img-back');
            const raw = getCachedEl('fotopanel-pack-img-raw');
            const label = getCachedEl('fotopanel-label');
            const price = getCachedEl('fotopanel-price');
            
            if (front) front.src = config.img;
            if (back) back.src = config.imgBack;
            if (raw) raw.src = config.imgRaw;
            if (label) label.textContent = config.label;
            if (price) price.textContent = config.price;
        }

        // WhatsApp Order Dispatcher
        function acquireNodeCashflow() {
            const variant = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const message = [
                `ORDER: ${variant.label}`,
                `VARIANT: ${currentFotoVariant}`,
                `SPEC: ${variant.spec}`,
                `MEDIA: ${variant.media}`,
                `FINISH: ${variant.finish}`,
                `ID: ${variant.id}`,
                `PRICE: ${variant.price}`
            ].join('\n');

            triggerHaptic([15, 40, 15]);
            window.open(`https://api.whatsapp.com/send?phone=${targetPhoneNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        // Interruptor Acromático (Dark / White Mode)
        function inicializarAlternadorAcromatico() {
            const trigger = getCachedEl('acromatic-toggle-trigger');
            if (!trigger) return;

            trigger.addEventListener('click', () => {
                const htmlNode = document.documentElement;
                const currentTheme = htmlNode.getAttribute('data-theme') || 'dark';
                const nextTheme = currentTheme === 'dark' ? 'white' : 'dark';
                
                htmlNode.setAttribute('data-theme', nextTheme);
                triggerHaptic([20, 10]);
            });
        }

        // Initialize Application Controls
        document.addEventListener('DOMContentLoaded', () => {
            const btnReveal = getCachedEl('btn-reveal-bio');
            const modes = ['front', 'back', 'raw'];

            if (btnReveal) {
                btnReveal.addEventListener('click', () => {
                    inspectModeIndex = (inspectModeIndex + 1) % modes.length;
                    applyVisualMode(modes[inspectModeIndex]);
                    triggerHaptic(12);
                });
            }

            inicializarAlternadorAcromatico();
            updateFotoUI();
        });
    </script>
</body>
</html>
