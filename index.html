<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOTOPANEL</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS VARIABLES & THEME CONFIGURATION */
        :root[data-theme="dark"] {
            --jako-bg: #121212;
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.15);
            --jako-glass: rgba(30, 30, 30, 0.6);
            --jako-led: rgba(255, 255, 255, 0.6);
            --gradient-start: rgba(255, 255, 255, 0.05);
            --gradient-mid: rgba(18, 18, 18, 0.85);
            --gradient-end: #121212;
            --icon-hover: #ffffff;
        }

        :root[data-theme="light"] {
            --jako-bg: #f8f9fa;
            --jako-text: #000000;
            --jako-border: rgba(0, 0, 0, 0.12);
            --jako-glass: rgba(255, 255, 255, 0.4);
            --jako-led: rgba(0, 0, 0, 0.3);
            --gradient-start: rgba(0, 0, 0, 0.02);
            --gradient-mid: rgba(248, 249, 250, 0.85);
            --gradient-end: #ffffff;
            --icon-hover: #666666;
        }

        /* GLOBAL RESET & BASE STYLES */
        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: inherit;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
        }

        body { 
            font-family: 'Orbitron', monospace, sans-serif; 
            background-color: var(--jako-bg); 
            color: var(--jako-text); 
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            position: relative;
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            transition: background-color 0.5s ease, color 0.5s ease;
        } 

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        button, span, div { -webkit-tap-highlight-color: transparent; }

        /* AMBIENT BACKGROUND OVERLAYS */
        #page-bg-overlay, .ambient-gradient {
            position: fixed;
            inset: 0;
        }

        #page-bg-overlay {
            background: radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
            will-change: background;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ambient-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
            z-index: 0;
            pointer-events: none;
        }

        /* GLOBAL TRANSITION SELECTOR */
        .img-glow-transition, .info-strip, .action-controls-grid, footer, #fotopanel-pack-container, .panel-back-view {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease, border-color 0.5s ease;
        }

        /* GLASS BUTTONS & COMMON BUTTON STYLES */
        button {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--jako-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover { opacity: 0.8; }
        button:active { transform: scale(0.92); }

        .btn-reset-text {
            width: auto;
            padding: 0 0.5rem;
            gap: 0.5rem;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.25em;
        }

        .icon-tele, .icon-stroke {
            width: 1.8rem;
            height: 1.8rem;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        .icon-tele {
            fill: var(--jako-text);
            pointer-events: none;
        }

        .icon-stroke { stroke: var(--jako-text); }
        button:hover .icon-tele { fill: var(--icon-hover); }
        button:hover .icon-stroke { stroke: var(--icon-hover); }

        /* RESTRUCTURED 6-BLOCK HEIGHT LAYOUT (10% - 5% - 65% - 5% - 10% - 5%) */
        .header-bar {
            height: 10dvh;
            max-height: 10dvh;
            flex-shrink: 0;
        }

        .info-strip-top {
            height: 5dvh;
            max-height: 5dvh;
            flex-shrink: 0;
        }

        .main-visualizer-container {
            height: 65dvh;
            max-height: 65dvh;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .info-strip-bottom {
            height: 5dvh;
            max-height: 5dvh;
            flex-shrink: 0;
        }

        .controls-bar {
            height: 10dvh;
            max-height: 10dvh;
            flex-shrink: 0;
        }

        .footer-container {
            height: 5dvh;
            max-height: 5dvh;
            width: 100%;
            flex-shrink: 0;
            background: var(--jako-glass);
            backdrop-filter: blur(10px);
            z-index: 50;
            padding: 0 1.5rem;
            border-top: 1px solid var(--jako-border);
        }

        /* MAIN CONTAINER RESPONSIBLE FOR ENTIRE SCALING */
        #fotopanel-pack-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            max-height: 55dvh;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            margin: auto;
            cursor: pointer;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.6));
            transform-origin: center center;
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Front Image Transformation Handling */
        .panel-front-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            transition: transform 0.3s ease, filter 0.5s ease;
        }

        .panel-back-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .panel-back-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* MONOCHROME FILTER STATE */
        .grayscale-filter {
            filter: grayscale(100%);
        }

        /* UNIFIED FLEX LAYOUT FOR INFO STRIP & FOOTER */
        .info-strip, .footer-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* PRODUCT SPECIFICATION STRIP */
        .info-strip {
            width: 100%;
            color: var(--jako-text);
            font-size: 9px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 0.3rem 1rem;
            gap: 1.5rem;
            z-index: 20;
        }

        .info-strip-content {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            white-space: nowrap;
        }

        .info-item-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .info-item-title {
            font-size: 7px;
            opacity: 0.5;
            letter-spacing: 0.15em;
        }

        .info-separator {
            opacity: 0.4;
            font-weight: 300;
        }

        .tele-value { 
            color: var(--jako-text); 
            text-shadow: var(--jako-led), var(--jako-led);
            transform: translateZ(0);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        /* ACTION CONTROLS BAR */
        .action-controls-grid {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 0.5rem;
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
            gap: 1rem;
        }

        .btn-control-action {
            width: 3.8rem !important;
            height: 100%;
        }

        /* FOOTER BRANDING */
        .footer-brand-text {
            display: flex;
            align-items: center;
            gap: 0.35em;
            font-size: 7px;
            letter-spacing: 0.35em;
            font-weight: 700;
            color: var(--jako-text);
            opacity: 0.5;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
            line-height: 1;
        }

        .footer-copy-symbol {
            font-size: 1.5em;
            line-height: 1;
        }

        .footer-container:hover .footer-brand-text { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="page-bg-overlay"></div>
    <div class="ambient-gradient"></div>
        
    <!-- Block 1: Header Bar (10% Height) -->
    <div class="action-controls-grid header-bar" style="position: relative; justify-content: center;">
        <button class="btn-reset-text" title="Home / Reset" onclick="resetView()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5.5" class="icon-stroke">
                <rect x="4" y="4" width="16" height="16" />
            </svg>
            <span>FOTOPANEL</span>
        </button>

        <button id="btn-theme-toggle" title="Toggle Theme (Light/Dark)" onclick="toggleTheme()" class="btn-control-action" style="position: absolute; right: 1rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-stroke">
                <circle cx="12" cy="12" r="5" />
                <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
        </button>
    </div>

    <!-- Block 2: Top Spec Strip (5% Height) -->
    <div class="info-strip info-strip-top">
        <div class="info-strip-content">
            <span class="info-separator">Your printing services</span>
        </div>
    </div>

    <!-- Block 3: Main Visualizer Stage (65% Height) -->
    <main class="main-visualizer-container">
        <div id="fotopanel-pack-container" onclick="toggleBackView()">
            <div class="pack-viewport"></div>
        </div>
    </main>

    <!-- Block 4: Bottom Spec Strip (5% Height) -->
    <div class="info-strip info-strip-bottom">
        <div class="info-strip-content">

            <div class="info-item-block">
                <span id="fotopanel-finish" class="tele-value">ADH INKJET</span>
                <span class="info-item-title">PRINTING</span>
            </div>

            <span class="info-separator">/</span>

            <div class="info-item-block">
                <span id="fotopanel-label" class="tele-value">40X40</span>
                <span class="info-item-title">CMS</span>
            </div>
            
            <span class="info-separator">/</span>

            <div class="info-item-block">
                <span id="fotopanel-media" class="tele-value">MDF 12MM</span>
                <span class="info-item-title">MDF</span>
            </div>

            <span class="info-separator">/</span>

            <div class="info-item-block">
                <span id="fotopanel-price" class="tele-value">$40MIL</span>
                <span class="info-item-title">COP $</span>
            </div>
        </div>
    </div>

    <!-- Block 5: Action Controls Bar (10% Height) -->
    <div class="action-controls-grid controls-bar">
        <input type="file" id="user-image-input" accept="image/*" style="display: none;" onchange="handleUserImageUpload(event)">

        <button id="btn-upload-image" title="Upload Custom Photo" onclick="triggerImageUpload()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <path d="M4 8V4h16v4" />
                <path d="M12 17V7m0 0l-4 4m4-4l4 4" />
            </svg>
        </button>

        <button id="btn-crop-zoom" title="Recuadrar / Zoom Photo" onclick="cycleImageCropScale()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m-3-3h6" />
            </svg>
        </button>

        <button id="btn-change-scale" title="Change Scale / Size" onclick="rotateFotoVariant('next')" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-stroke">
                <rect x="5" y="5" width="14" height="14" />
            </svg>
        </button>

        <button id="btn-mode-color" title="Color Mode" onclick="setFotoColorMode(false)" class="btn-control-action">
            <svg viewBox="0 0 24 24" class="icon-stroke">
                <defs>
                    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="25%" stop-color="#ff0000" />
                        <stop offset="50%" stop-color="#ff7f00" />
                        <stop offset="75%" stop-color="#0000ff" />
                        <stop offset="100%" stop-color="#8b00ff" />
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="16" height="16" fill="url(#rainbow-grad)" stroke="none" />
            </svg>
        </button>

        <button id="btn-mode-bw" title="B&W Mode" onclick="setFotoColorMode(true)" class="btn-control-action">
            <svg viewBox="0 0 24 24" class="icon-stroke">
                <defs>
                    <linearGradient id="bw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="16" height="16" fill="url(#bw-grad)" stroke="none" />
            </svg>
        </button>

        <button id="btn-activate-node" title="Order via WhatsApp" onclick="acquireNodeCashflow()" class="btn-control-action" style="padding: 0.5rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <path d="M4 16v4h16v-4" />
                <path d="M12 7v10m0 0l-4-4m4 4l4-4" />
            </svg>
        </button>
    </div>

    <!-- Block 6: Footer Bar (5% Height) -->
    <footer class="footer-container">
        <span class="footer-brand-text">
            <span>JAKO.DEV</span>
            <span class="footer-copy-symbol">©</span>
            <span>2026</span>
        </span>
    </footer>

    <!-- Core Logic Engine -->
    <script>
        // Product catalog specifications
        const ARTEPANEL_CATALOG = {
            'PULSOR': {
                defaultVariant: 'PANEL 20X20',
                variants: {
                    'PANEL 20X20': { 
                        label: '20X20', 
                        spec: 'Your photo personalized', 
                        media: '12MM',
                        finish: 'ADH INKJET PRINT',
                        price: '20MIL', 
                        id: 'FP-20X20',
                        scale: 0.50
                    },
                    'PANEL 30X30': { 
                        label: '30X30', 
                        spec: 'Your photo personalized', 
                        media: '9MM',
                        finish: 'ADH INKJET PRINT',
                        price: '30MIL', 
                        id: 'FP-30X30',
                        scale: 0.75
                    },
                    'PANEL 40X40': { 
                        label: '40X40', 
                        spec: 'Your photo personalized', 
                        media: '9MM',
                        finish: 'ADH INKJET PRINT',
                        price: '40MIL', 
                        id: 'FP-40X40',
                        scale: 1.00
                    }
                }
            }
        };

        // Application State
        let currentFotoItem = 'PULSOR';
        let currentFotoVariant = 'PANEL 40X40';
        let isGrayscale = false;
        let isShowingBack = false;
        let activeImageSrc = 'img/photo.png';
        const backImageSrc = 'img/30x30B.png';
        const targetPhoneNumber = "573128707083";

        // Image Crop / Scale States (1.0 = Fit/Original, 1.25 = Zoom In, 1.5 = Max Zoom)
        const imageCropScales = [1.0, 1.25, 1.5];
        let currentCropIndex = 0;

        // DOM Cache Helper
        const cachedElements = {};
        const getCachedEl = (id) => cachedElements[id] || (cachedElements[id] = document.getElementById(id));

        // Haptic Feedback Trigger
        const triggerHaptic = (pattern) => { 
            if (navigator.vibrate) navigator.vibrate(pattern); 
        };

        // Toggle UI Theme (Dark / Light)
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', nextTheme);
            localStorage.setItem('fotopanel_theme', nextTheme);
            triggerHaptic(10);
        }

        // Initialize Theme from LocalStorage
        function initTheme() {
            const savedTheme = localStorage.getItem('fotopanel_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // Trigger Hidden File Upload Input
        function triggerImageUpload() {
            const input = getCachedEl('user-image-input');
            if (input) input.click();
        }

        // Handle Custom User Image Upload & Reset Back View / Scale
        function handleUserImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                activeImageSrc = e.target.result;
                isShowingBack = false;
                currentCropIndex = 0;
                updateFotoUI();
                triggerHaptic([10, 20]);
            };
            reader.readAsDataURL(file);
        }

        // Cycle through Image Zoom/Crop levels
        function cycleImageCropScale() {
            currentCropIndex = (currentCropIndex + 1) % imageCropScales.length;
            isShowingBack = false;
            updateFotoUI();
            triggerHaptic(12);
        }

        // Cycle Panel Variants (Sizes) & Reset Back View
        function rotateFotoVariant(direction = 'next') {
            const variants = Object.keys(ARTEPANEL_CATALOG[currentFotoItem].variants);
            let currentIndex = variants.indexOf(currentFotoVariant);
            
            currentIndex = direction === 'next' 
                ? (currentIndex + 1) % variants.length 
                : (currentIndex - 1 + variants.length) % variants.length;
            
            currentFotoVariant = variants[currentIndex];
            isShowingBack = false;
            updateFotoUI();
            triggerHaptic(15);
        }

        // Set Color or Black & White Mode & Reset Back View
        function setFotoColorMode(enableBW) {
            isShowingBack = false;
            if (isGrayscale === enableBW) {
                updateFotoUI();
                return;
            }
            isGrayscale = enableBW;
            updateFotoUI();
            triggerHaptic(10);
        }

        // Toggle Back PNG Surface Visibility
        function toggleBackView() {
            isShowingBack = !isShowingBack;
            const backEl = document.querySelector('.panel-back-view');
            if (backEl) {
                backEl.classList.toggle('active', isShowingBack);
            }
            triggerHaptic(20);
        }

        // Reset Entire Application View State
        function resetView() {
            currentFotoVariant = 'PANEL 40X40';
            isGrayscale = false;
            isShowingBack = false;
            currentCropIndex = 0;
            activeImageSrc = 'img/photo.png';
            const input = getCachedEl('user-image-input');
            if (input) input.value = '';
            
            updateFotoUI();
            triggerHaptic([10, 10]);
        }

        // Render Surface Images & Update Container Scaling
        function renderPanelImages(config) {
            const container = getCachedEl('fotopanel-pack-container');
            if (!container) return;

            container.style.transform = `scale(${config.scale})`;

            let viewport = container.querySelector('.pack-viewport');
            if (!viewport) {
                viewport = document.createElement('div');
                viewport.className = 'pack-viewport';
                container.appendChild(viewport);
            }

            const bwClass = isGrayscale ? 'grayscale-filter' : '';
            const backActiveClass = isShowingBack ? 'active' : '';
            const imgZoom = imageCropScales[currentCropIndex];

            viewport.innerHTML = `
                <div style="position: absolute; inset: 0; background-color: #e5e5e5; z-index: 1;"></div>
                <img src="${activeImageSrc}" alt="Panel Surface Front" class="img-glow-transition panel-front-view ${bwClass}" style="z-index: 10; transform: scale(${imgZoom});" />
                <img src="${backImageSrc}" alt="Panel Surface Back" class="img-glow-transition panel-back-view ${backActiveClass}" />
            `;
        }

        // Synchronize UI Elements with Catalog State
        function updateFotoUI() {
            const config = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const label = getCachedEl('fotopanel-label');
            const price = getCachedEl('fotopanel-price');
            const media = getCachedEl('fotopanel-media');
            
            if (label) label.textContent = config.label;
            if (price) price.textContent = config.price;
            if (media) media.textContent = config.media;

            renderPanelImages(config);
        }

        // Handle WhatsApp Checkout Action
        function acquireNodeCashflow() {
            const variant = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const message = [
                `ORDER: ${variant.label}`,
                `VARIANT: ${currentFotoVariant}`,
                `SPEC: ${variant.spec}`,
                `MEDIA: ${variant.media}`,
                `FINISH: ${variant.finish}`,
                `STYLE: ${isGrayscale ? 'Black & White' : 'Color'}`,
                `ZOOM: ${imageCropScales[currentCropIndex]}x`,
                `ID: ${variant.id}`,
                `PRICE: ${variant.price}`
            ].join('\n');

            triggerHaptic([15, 40, 15]);
            window.open(`https://api.whatsapp.com/send?phone=${targetPhoneNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        // DOM Content Loaded Handler
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateFotoUI();
        });
    </script>
</body>
</html>
