<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOTOPANEL.ART</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS VARIABLES & THEME CONFIGURATION */
        :root[data-theme="dark"] {
            --jako-bg: #121212;
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.15);
            --jako-glass: rgba(30, 30, 30, 0.6);
            --jako-led: rgba(255, 255, 255, 0.6);
            --gradient-start: rgba(255, 255, 255, 0.05);
            --gradient-mid: rgba(18, 18, 18, 0.85);
            --gradient-end: #121212;
            --icon-hover: #ffffff;
        }

        :root[data-theme="light"] {
            --jako-bg: #f8f9fa;
            --jako-text: #000000;
            --jako-border: rgba(0, 0, 0, 0.12);
            --jako-glass: rgba(255, 255, 255, 0.4);
            --jako-led: rgba(0, 0, 0, 0.3);
            --gradient-start: rgba(0, 0, 0, 0.02);
            --gradient-mid: rgba(248, 249, 250, 0.85);
            --gradient-end: #ffffff;
            --icon-hover: #666666;
        }

        :root {
            --halftone-size: 3.6px;
        }

        /* HALFTONE WRAPPER AND DOT MATRIX OVERLAY */
        .halftone-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
        }

        .halftone-filter {
            filter: grayscale(100%) contrast(200%) brightness(105%);
            transition: filter 0.3s ease;
        }

        .halftone-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at center, rgba(0,0,0,0.85) 35%, transparent 36%);
            background-size: var(--halftone-size) var(--halftone-size);
            background-repeat: repeat;
            pointer-events: none;
            z-index: 15;
            mix-blend-mode: multiply;
            opacity: 0.7;
        }

        .halftone-coarse {
            --halftone-size: 10.8px;
        }

        .halftone-filter.inverted-active {
            filter: grayscale(100%) contrast(200%) brightness(105%) invert(1);
        }

        /* GLOBAL RESET & BASE STYLES */
        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: inherit;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
        }

        body { 
            font-family: 'Orbitron', monospace, sans-serif; 
            background-color: var(--jako-bg); 
            color: var(--jako-text); 
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            position: relative;
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            transition: background-color 0.5s ease, color 0.5s ease;
        } 

        #texture-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-size: cover;
            background-position: center;
            opacity: 0.15; 
            transition: background-image 0.4s ease, opacity 0.4s ease;
            mix-blend-mode: overlay; 
        }

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        button, span, div { -webkit-tap-highlight-color: transparent; }

        /* AMBIENT BACKGROUND OVERLAYS */
        #page-bg-overlay, .ambient-gradient {
            position: fixed;
            inset: 0;
        }

        #page-bg-overlay {
            background: radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
            will-change: background;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ambient-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
            z-index: 0;
            pointer-events: none;
        }

        /* GLOBAL TRANSITIONS */
        .img-glow-transition, .info-strip, footer, #fotopanel-pack-container, .panel-back-view {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease, border-color 0.5s ease;
        }

        /* BUTTON BASE STYLES */
        button {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--jako-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover { opacity: 0.8; }
        button:active { transform: scale(0.92); }
        button.active-btn { opacity: 1; filter: drop-shadow(0 0 5px var(--jako-text)); }

        .btn-reset-text {
            width: auto;
            padding: 0 0.5rem;
            gap: 0.5rem;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.25em;
        }

        .icon-tele, .icon-stroke {
            width: 1.2rem;
            height: 1.2rem;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        .icon-tele {
            fill: var(--jako-text);
            pointer-events: none;
        }

        .icon-stroke { stroke: var(--jako-text); }
        button:hover .icon-tele { fill: var(--icon-hover); }
        button:hover .icon-stroke { stroke: var(--icon-hover); }

        /* LAYOUT HEIGHT SECTIONS */
        .header-bar {
            height: 10dvh;
            max-height: 10dvh;
            flex-shrink: 0;
            display: flex;
            justify-content: center; 
            align-items: center;
            width: 100%;
            padding: 0 1rem;
            position: relative;
            z-index: 100;
            border-bottom: 1px solid var(--jako-border);
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
        }

        .info-strip-top {
            height: 5dvh;
            max-height: 5dvh;
            flex-shrink: 0;
        }

        /* MAIN VISUALIZER CONTAINER */
        .main-visualizer-container {
            height: 65dvh;
            max-height: 65dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            background-color: transparent; 
        }

        .info-strip-bottom {
            height: 5dvh;
            max-height: 5dvh;
            flex-shrink: 0;
        }

        .controls-bar {
            height: 10dvh;
            max-height: 10dvh;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 0.5rem;
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
            gap: 1.5rem;
        }

        .footer-container {
            height: 5dvh;
            max-height: 5dvh;
            width: 100%;
            flex-shrink: 0;
            background: var(--jako-glass);
            backdrop-filter: blur(10px);
            z-index: 50;
            padding: 0 1.25rem; 
            border-top: 1px solid var(--jako-border);
            display: flex;
            align-items: center;
            justify-content: space-between !important; 
        }

        /* PACK CONTAINER */
        #fotopanel-pack-container {
            position: relative;
            height: 100%;
            max-height: 55dvh;
            width: auto;
            flex-shrink: 0;
            margin: auto;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.6));
            transform-origin: center center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #fotopanel-pack-container.mode-single {
            aspect-ratio: 1 / 1;
        }

        #fotopanel-pack-container.mode-grid {
            aspect-ratio: 1 / 2;
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 4px;
        }

        /* GRID / MOSAIC VIEWPORT STYLES */
        .mosaic-grid-container {
            display: grid;
            width: 100%;
            height: 100%;
            background-color: var(--jako-bg);
            gap: 1px;
        }

        .mosaic-node-tile {
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* FRONT IMAGE STYLING */
        .user-surface-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            will-change: transform;
        }

        #fotopanel-pack-container img.panel-back-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .panel-back-view {
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .panel-back-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .info-strip, .footer-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            color: var(--jako-text);
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 0.8rem 2rem;
            gap: 1.5rem;
            z-index: 20;
        }

        .info-strip-content {
            display: flex;
            align-items: center;
            gap: 1rem;
            white-space: nowrap;
        }

        .info-item-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }

        .info-item-title {
            font-size: 7px;
            opacity: 0.5;
            letter-spacing: 0.15em;
        }

        .info-separator {
            opacity: 0.4;
            font-weight: 300;
        }

        .tele-value { 
            color: var(--jako-text); 
            text-shadow: var(--jako-led), var(--jako-led);
            transform: translateZ(0);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .btn-control-action {
            width: 3.8rem !important;
            height: 100%;
        }

        /* FOOTER BRANDING */
        .footer-brand-text {
            display: flex;
            align-items: center;
            gap: 0.35em;
            font-size: 7px;
            letter-spacing: 0.35em;
            font-weight: 700;
            color: var(--jako-text);
            opacity: 0.5;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
            line-height: 1;
        }

        .footer-copy-symbol {
            font-size: 1.5em;
            line-height: 1;
        }

        .footer-container:hover .footer-brand-text { opacity: 0.9; }

        /* RESPONSIVE SCALING */
        @media (max-height: 667px) {
            .footer-container { padding: 0 0.5rem; }
            .btn-reset-text { font-size: 10px; }
            .icon-stroke { width: 1.1rem; height: 1.1rem; }
            .info-strip { font-size: 7px; gap: 0.4rem; }
            .info-strip-content { gap: 0.4rem; }
            .info-item-title { font-size: 6px; }
            #fotopanel-pack-container { max-height: 48dvh; }
            .controls-bar { gap: 0.5rem; margin-bottom: 0.4rem; }
            .btn-control-action { width: 2rem !important; }
        }
    </style>
</head>
<body>

    <div id="page-bg-overlay"></div>
    <div id="texture-overlay"></div>
    <div class="ambient-gradient"></div>
        
    <!-- TOP HEADER -->
    <header class="header-bar" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0.2rem;">
        <button class="btn-reset-text" title="Inicio / Reiniciar" onclick="resetView()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5.5" class="icon-stroke">
                <rect x="4" y="4" width="16" height="16" />
            </svg>
            <span>FOTOPANEL</span>
        </button>
        <span id="top-strip-text" style="font-size: 7px; opacity: 0.5; letter-spacing: 0.25em; text-transform: uppercase;">IMAGINA • ENFOCA • PROYECTA</span>
    </header>

    <!-- MAIN VISUALIZER STAGE -->
    <main class="main-visualizer-container">
        <div id="fotopanel-pack-container" class="mode-single">
            <div class="pack-viewport"></div>
        </div>
    </main>

    <!-- BOTTOM SPEC STRIP -->
    <div class="info-strip info-strip-bottom">
        <div class="info-strip-content">
            <div class="info-item-block">
                <span id="fotopanel-finish" class="tele-value">GRABADO LASER</span>
                <span id="lbl-printing-media" class="info-item-title">GRABADO LÁSER</span>
            </div>

            <span class="info-separator">/</span>

            <div class="info-item-block">
                <span id="fotopanel-media" class="tele-value">ACM 3MM</span>
                <span id="lbl-mdf-support" class="info-item-title">MATERIAL</span>
            </div>

            <span class="info-separator">/</span>

            <div class="info-item-block">
                <span id="fotopanel-label" class="tele-value">10X10 ACM 12MM</span>
                <span class="info-item-title">CMS</span>
            </div>
            
            <span class="info-separator">/</span>
            
            <div class="info-item-block">
                <span id="fotopanel-price" class="tele-value">25MIL</span>
                <span class="info-item-title">COP $</span>
            </div>
        </div>
    </div>

    <!-- BOTTOM ACTION CONTROLS -->
    <div class="controls-bar">
        <!-- Hidden file input for custom uploads -->
        <input type="file" id="user-image-input" accept="image/*" style="display: none;" onchange="handleUserImageUpload(event)">

        <!-- Upload image button -->
        <button id="btn-upload-image" title="Subir Foto Personalizada" onclick="triggerImageUpload()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <path d="M4 8V4h16v4" />
                <path d="M12 17V7m0 0l-4 4m4-4l4 4" />
            </svg>
        </button>

        <!-- Toggle Image Color Inversion -->
        <button id="btn-invert-color" title="Invertir Color de Imagen" onclick="toggleImageInvert()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor" />
            </svg>
        </button>

        <!-- Toggle Halftone Dot Density (3.6px vs 10.8px) -->
        <button id="btn-toggle-halftone-size" title="Cambiar Tamaño de Puntos Halftone (3.6px / 10.8px)" onclick="toggleHalftoneSize()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <circle cx="6" cy="6" r="1.5" fill="currentColor" />
                <circle cx="12" cy="6" r="1.5" fill="currentColor" />
                <circle cx="18" cy="6" r="1.5" fill="currentColor" />
                <circle cx="6" cy="12" r="2" fill="currentColor" />
                <circle cx="12" cy="12" r="2.5" fill="currentColor" />
                <circle cx="18" cy="12" r="2" fill="currentColor" />
                <circle cx="6" cy="18" r="1.5" fill="currentColor" />
                <circle cx="12" cy="18" r="1.5" fill="currentColor" />
                <circle cx="18" cy="18" r="1.5" fill="currentColor" />
            </svg>
        </button>

        <!-- Toggle Mosaic / Package Mural Grid (Nodes) -->
        <button id="btn-toggle-grid" title="Mural en Mosaico (Paquete)" onclick="toggleGridMode()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
            </svg>
        </button>
    </div>

    <!-- FOOTER -->
    <footer class="footer-container">
        <a href="https://github.com/jalkn" target="_blank" rel="noopener noreferrer" class="footer-brand-text" style="text-decoration: none; color: inherit;">
            <span>JAKO.DEV</span>
            <span class="footer-copy-symbol">©</span>
            <span>2026</span>
        </a>     

        <button id="btn-theme-toggle" title="Cambiar Tema (Claro/Oscuro)" onclick="toggleTheme()" class="btn-control-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-stroke">
                <circle cx="12" cy="12" r="5" />
                <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
        </button>
    </footer>

    <!-- Core Logic Engine -->
    <script>
        // Single variant catalog setup for ACM 10x10 Laser
        const ARTEPANEL_CATALOG = {
            'PULSOR': {
                defaultVariant: 'STENCIL 10X10',
                variants: {
                    'STENCIL 10X10': { 
                        label: '10X10', 
                        spec_es: 'CORTE LASER SOLID',
                        media: '200GRS',
                        finish: 'PAPEL REC.',
                        price: '25MIL', 
                        scale: 0.50,
                        nodes: {
                            cols: 10,
                            rows: 20,
                            total: 200,
                            muralLabel: '200X100', 
                            totalPriceFormatted: '5MILLONES'
                        }
                    }
                }
            }
        };

        // Application state initializations
        let currentFotoItem = 'PULSOR';
        let currentFotoVariant = 'STENCIL 10X10';
        let isGridMode = false;
        let isImageInverted = false;
        let isCoarseHalftone = false;

        // Fixed static image paths
        const defaultStaticImageSrc = 'img/photo.png';
        let activeImageSrc = defaultStaticImageSrc;
        const backImageSrc = 'img/back.png';
        const targetPhoneNumber = "573128707083";

        // Icon SVG Templates for grid toggle button
        const SVG_GRID_FOUR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /></svg>`;
        const SVG_GRID_SINGLE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke"><rect x="4" y="4" width="16" height="16" /></svg>`;

        // DOM elements cache helper
        const cachedElements = {};
        const getCachedEl = (id) => cachedElements[id] || (cachedElements[id] = document.getElementById(id));

        // Haptic feedback function
        const triggerHaptic = (pattern) => { 
            if (navigator.vibrate) navigator.vibrate(pattern); 
        };

        // Toggle UI theme (Dark / Light)
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', nextTheme);
            localStorage.setItem('fotopanel_theme', nextTheme);
            triggerHaptic(10);
        }

        // Initialize Theme preference from localStorage
        function initTheme() {
            const savedTheme = localStorage.getItem('fotopanel_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // Open hidden file input element
        function triggerImageUpload() {
            const input = getCachedEl('user-image-input');
            if (input) input.click();
        }

        // Handle custom image uploads
        function handleUserImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                activeImageSrc = e.target.result;
                updateFotoUI();
                triggerHaptic([10, 20]);
            };
            reader.readAsDataURL(file);
        }

        // Toggle Grid Mode (Mosaico 200 Nodos)
        function toggleGridMode() {
            isGridMode = !isGridMode;
            const btn = getCachedEl('btn-toggle-grid');
            if (btn) {
                if (isGridMode) {
                    btn.classList.add('active-btn');
                    btn.innerHTML = SVG_GRID_SINGLE;
                    btn.title = "Ver Panel Individual";
                } else {
                    btn.classList.remove('active-btn');
                    btn.innerHTML = SVG_GRID_FOUR;
                    btn.title = "Mural en Mosaico (Paquete)";
                }
            }
            updateFotoUI();
            triggerHaptic([15, 30]);
        }

        // Toggle Halftone Grid Size (3.6px vs 10.8px)
        function toggleHalftoneSize() {
            isCoarseHalftone = !isCoarseHalftone;
            const btn = getCachedEl('btn-toggle-halftone-size');
            
            if (btn) {
                btn.classList.toggle('active-btn', isCoarseHalftone);
            }
            
            const wrappers = document.querySelectorAll('.halftone-wrapper');
            wrappers.forEach(w => {
                w.classList.toggle('halftone-coarse', isCoarseHalftone);
            });

            triggerHaptic([10, 20]);
        }

        // Toggle Image Inversion
        function toggleImageInvert() {
            isImageInverted = !isImageInverted;
            
            const halftoneElements = document.querySelectorAll('.halftone-filter');
            const btn = getCachedEl('btn-invert-color');

            halftoneElements.forEach(el => {
                if (isImageInverted) {
                    el.classList.add('inverted-active');
                } else {
                    el.classList.remove('inverted-active');
                }
            });

            if (btn) {
                btn.classList.toggle('active-btn', isImageInverted);
            }

            triggerHaptic([10, 20]);
        }

        // Reset stage to default setup
        function resetView() {
            isGridMode = false;
            isImageInverted = false;
            isCoarseHalftone = false;
            activeImageSrc = defaultStaticImageSrc;
            
            const btnGrid = getCachedEl('btn-toggle-grid');
            if (btnGrid) {
                btnGrid.classList.remove('active-btn');
                btnGrid.innerHTML = SVG_GRID_FOUR;
                btnGrid.title = "Mural en Mosaico (Paquete)";
            }

            const btnInvert = getCachedEl('btn-invert-color');
            if (btnInvert) btnInvert.classList.remove('active-btn');

            const btnHalftone = getCachedEl('btn-toggle-halftone-size');
            if (btnHalftone) btnHalftone.classList.remove('active-btn');

            const input = getCachedEl('user-image-input');
            if (input) input.value = '';
            
            updateFotoUI();
            triggerHaptic([10, 10]);
        }

        // Render current panel images within viewport
        function renderPanelImages(config) {
            const container = getCachedEl('fotopanel-pack-container');
            const invertClass = isImageInverted ? ' inverted-active' : '';
            const coarseClass = isCoarseHalftone ? ' halftone-coarse' : '';
            if (!container) return;

            if (isGridMode) {
                container.classList.remove('mode-single');
                container.classList.add('mode-grid');
                container.style.transform = `scale(0.85)`;
            } else {
                container.classList.remove('mode-grid');
                container.classList.add('mode-single');
                container.style.transform = `scale(${config.scale})`;
            }

            let viewport = container.querySelector('.pack-viewport');
            if (!viewport) {
                viewport = document.createElement('div');
                viewport.className = 'pack-viewport';
                container.appendChild(viewport);
            }

            if (isGridMode) {
                const cols = config.nodes.cols;
                const rows = config.nodes.rows;
                
                let mosaicHTML = `<div class="halftone-wrapper${coarseClass}"><div class="mosaic-grid-container halftone-filter${invertClass}" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr);">`;
                
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const posX = cols > 1 ? (c / (cols - 1)) * 100 : 0;
                        const posY = rows > 1 ? (r / (rows - 1)) * 100 : 0;
                        
                        mosaicHTML += `<div class="mosaic-node-tile" style="background-image: url('${activeImageSrc}'); background-size: ${cols * 100}% ${rows * 100}%; background-position: ${posX}% ${posY}%;"></div>`;
                    }
                }
                mosaicHTML += `</div></div>`;
                
                viewport.innerHTML = mosaicHTML;
            } else {
                viewport.innerHTML = `
                    <div style="position: absolute; inset: 0; background-color: #e5e5e5; z-index: 1;"></div>
                    <div class="halftone-wrapper${coarseClass}" style="position: absolute; inset: 0; z-index: 10;">
                        <img src="${activeImageSrc}" alt="Panel Surface Front" class="user-surface-image img-glow-transition halftone-filter${invertClass}" />
                    </div>
                    <img src="${backImageSrc}" alt="Panel Surface Back" class="img-glow-transition panel-back-view" style="z-index: 20; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;" />
                `;
                attachLongPressListener(viewport);
            }
        }

        // Attach hold / long-press events for smooth fade-in preview of back.png
        function attachLongPressListener(element) {
            const showBack = () => {
                const backImg = element.querySelector('.panel-back-view');
                if (backImg) {
                    backImg.style.opacity = '1';
                    triggerHaptic(15);
                }
            };

            const hideBack = () => {
                const backImg = element.querySelector('.panel-back-view');
                if (backImg) {
                    backImg.style.opacity = '0';
                }
            };

            element.addEventListener('touchstart', (e) => { e.preventDefault(); showBack(); }, { passive: false });
            element.addEventListener('touchend', hideBack);
            element.addEventListener('touchcancel', hideBack);

            element.addEventListener('mousedown', showBack);
            element.addEventListener('mouseup', hideBack);
            element.addEventListener('mouseleave', hideBack);
        }

        // Update UI specifications and trigger re-render
        function updateFotoUI() {
            const config = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const label = getCachedEl('fotopanel-label');
            const price = getCachedEl('fotopanel-price');
            const media = getCachedEl('fotopanel-media');
            const finish = getCachedEl('fotopanel-finish');
            const specEs = getCachedEl('lbl-printing-media');
            const mdfSupportLbl = getCachedEl('lbl-mdf-support');

            if (isGridMode) {
                if (label) label.textContent = config.nodes.muralLabel;
                if (mdfSupportLbl) mdfSupportLbl.textContent = `STENCILX${config.nodes.total}`;
                if (price) price.textContent = config.nodes.totalPriceFormatted;
                if (media) media.textContent = config.media;
                if (finish) finish.textContent = config.finish;
                if (specEs) specEs.textContent = config.spec_es;
            } else {
                if (label) label.textContent = config.label;
                if (mdfSupportLbl) mdfSupportLbl.textContent = 'STENCIL';
                if (price) price.textContent = config.price;
                if (media) media.textContent = config.media;
                if (finish) finish.textContent = config.finish;
                if (specEs) specEs.textContent = config.spec_es;
            }

            renderPanelImages(config);
        }

        // Initialize stage on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateFotoUI();
        });
    </script>
</body>
</html>
