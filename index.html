<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOTOPANEL</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS VARIABLES & THEME CONFIGURATION */
        :root {
            --jako-bg: #f8f9fa;
            --jako-text: #000000;
            --jako-border: rgba(0, 0, 0, 0.12);
            --jako-glass: rgba(255, 255, 255, 0.4);
            --jako-led: rgba(233, 227, 227, 0.455);
            --gradient-start: rgba(0, 0, 0, 0.02);
            --gradient-mid: rgba(248, 249, 250, 0.85);
            --gradient-end: #ffffff;
            --icon-hover: #b6b8b9;
        }

        /* DARK THEME OVERRIDES */
        [data-theme="dark"] {
            --jako-bg: #0d0f12;
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.15);
            --jako-glass: rgba(18, 22, 28, 0.6);
            --jako-led: rgba(50, 50, 50, 0.6);
            --gradient-start: rgba(255, 255, 255, 0.02);
            --gradient-mid: rgba(13, 15, 18, 0.85);
            --gradient-end: #000000;
            --icon-hover: #6c757d;
        }

        /* GLOBAL RESET & BASE STYLES */
        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: inherit;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
        }

        body { 
            font-family: 'Orbitron', monospace, sans-serif; 
            background-color: var(--jako-bg); 
            color: var(--jako-text); 
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            transition: background-color 0.5s ease, color 0.5s ease;
        } 

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        button, span, div { -webkit-tap-highlight-color: transparent; }

        /* AMBIENT BACKGROUND OVERLAYS */
        #page-bg-overlay, .ambient-gradient {
            position: fixed;
            inset: 0;
        }

        #page-bg-overlay {
            background: radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
            will-change: background;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ambient-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
            z-index: 0;
            pointer-events: none;
        }

        /* UI ANIMATIONS & TRANSITIONS */
        .img-glow-transition {
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: filter, transform, opacity;
        }

        .info-strip, .action-controls-grid, footer, #fotopanel-pack-container {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease, border-color 0.5s ease;
        }

        /* GLASS BUTTONS & ICON ARCHITECTURE */
        .btn-tele-glass {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--jako-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 0.35rem;
            padding: 0 0.4rem;
        }

        .btn-tele-glass:hover { opacity: 0.8; }
        .btn-tele-glass:active { transform: scale(0.92); }

        .btn-tag {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.15em;
            opacity: 0.6;
        }

        .btn-reset-text {
            width: auto;
            padding: 0 0.5rem;
            gap: 0.5rem;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.25em;
        }

        .icon-tele, .icon-stroke {
            width: 1rem;
            height: 1rem;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        .icon-tele {
            fill: var(--jako-text);
            pointer-events: none;
        }

        .icon-stroke { stroke: var(--jako-text); }
        .btn-tele-glass:hover .icon-tele { fill: var(--icon-hover); }
        .btn-tele-glass:hover .icon-stroke { stroke: var(--icon-hover); }

        /* VISUALIZER STAGE & PACK CONTAINERS */
        .main-visualizer-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            position: relative;
            overflow: hidden;
            transition: padding 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* MAIN CONTAINER RESPONSIBLE FOR ENTIRE SCALING */
        #fotopanel-pack-container {
            position: relative;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            margin: auto;
            cursor: pointer;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.6));
            transform-origin: center center;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #fotopanel-pack-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.5s ease;
        }

        /* IMAGE FILTER STATES */
        .grayscale-filter {
            filter: grayscale(100%);
        }

        .sepia-filter {
            filter: sepia(100%);
        }

        /* PRODUCT SPECIFICATION STRIP */
        .info-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--jako-text);
            font-size: 8px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            gap: 1rem;
            z-index: 20;
            overflow: hidden;
        }

        /* KEYFRAMES FOR INFINITE TICKER SCROLL */
        @keyframes scroll-left {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* MARQUEE CONTAINER & CONTENT */
        .info-marquee-wrapper {
            display: flex;
            justify-content: flex-start;
            overflow: hidden;
            width: 100%;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .info-strip-content {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.6rem;
            white-space: nowrap;
            will-change: transform;
            animation: scroll-left 12s linear infinite;
        }

        /* Pausa suave de la animación al pasar el cursor */
        .info-marquee-wrapper:hover .info-strip-content {
            animation-play-state: paused;
        }

        .spec-tag {
            opacity: 0.5;
            font-weight: 200;
        }

        .info-separator {
            opacity: 0.4;
            font-weight: 300;
        }

        .tele-value { 
            color: var(--jako-text); 
            text-shadow: var(--jako-led), var(--jako-led);
            transform: translateZ(0);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        /* ACTION CONTROLS BAR (CENTERED LAYOUT) */
        .action-controls-grid {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 3rem;
            padding: 0 0.5rem;
            border-top: 1px solid var(--jako-border);
            border-bottom: 1px solid var(--jako-border);
            background: var(--jako-glass);
            backdrop-filter: blur(20px);
            transition: background 0.5s ease, border-color 0.5s ease, opacity 0.5s ease, transform 0.5s ease;
            gap: 0.5rem;
            overflow-x: auto;
        }

        .action-controls-grid .btn-tele-glass {
            height: 100%;
            flex-shrink: 0;
        }

        /* FOOTER BRANDING (CENTERED LAYOUT) */
        .footer-container {
            height: 50px;
            width: 100%;
            flex-shrink: 0;
            background: var(--jako-glass);
            backdrop-filter: blur(10px);
            z-index: 50;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid var(--jako-border);
        }

        .footer-brand-text {
            display: flex;
            align-items: center;
            gap: 0.35em;
            font-size: 8px;
            letter-spacing: 0.35em;
            font-weight: 700;
            color: var(--jako-text);
            opacity: 0.5;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
            line-height: 1;
        }

        .footer-copy-symbol {
            font-size: 1.5em;
            line-height: 1;
        }

        .footer-container:hover .footer-brand-text { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="page-bg-overlay"></div>
    <div class="ambient-gradient"></div>
        
    <!-- Top Action Controls (Centered) -->
    <div class="action-controls-grid">
        <button class="btn-tele-glass btn-reset-text" title="Home / Reset" onclick="resetView()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5.5" class="icon-stroke">
                <rect x="4" y="4" width="16" height="16" />
            </svg>
            <span>FOTOPANEL</span>
        </button>
    </div>

    <!-- Visualizer Stage -->
    <main class="main-visualizer-container">
        <div id="fotopanel-pack-container">
            <div class="pack-viewport"></div>
        </div>

        <!-- Product Spec Strip with Upload and Acquire Actions Frozen on Sides -->
        <div class="info-strip">
            <!-- Hidden File Input for Custom Image Upload -->
            <input type="file" id="user-image-input" accept="image/*" style="display: none;" onchange="handleUserImageUpload(event)">

            <!-- Frozen Left: Upload Custom Image Button -->
            <button id="btn-upload-image" title="Upload Custom Photo" onclick="triggerImageUpload()" class="btn-tele-glass" style="width: auto; padding: 0.5rem; flex-shrink: 0;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                    <path d="M4 8V4h16v4" />
                    <path d="M12 17V7m0 0l-4 4m4-4l4 4" />
                </svg>
            </button>

            <!-- Center Spec Values Display with Active Scroll Animation -->
            <div class="info-marquee-wrapper">
                <div class="info-strip-content">
                    <span class="info-separator">/</span>
                    <div class="spec-item"><span class="spec-tag">COP:</span><span id="fotopanel-price" class="tele-value">$40MIL</span></div>
                    <span class="info-separator">/</span>
                    <div class="spec-item"><span class="spec-tag">DIM:</span><span id="fotopanel-dims" class="tele-value">40X40CM</span></div>
                    <span class="info-separator">/</span>
                    <div class="spec-item"><span class="spec-tag">TIK:</span><span id="fotopanel-thick" class="tele-value">9MM</span></div>
                    <span class="info-separator">/</span>

                    <!-- Secondary display set for seamless continuous loop -->
                    <div class="spec-item"><span class="spec-tag">COP:</span><span id="fotopanel-price-dup" class="tele-value">$40MIL</span></div>
                    <span class="info-separator">/</span>
                    <div class="spec-item"><span class="spec-tag">DIM:</span><span id="fotopanel-dims-dup" class="tele-value">40X40CM</span></div>
                    <span class="info-separator">/</span>
                    <div class="spec-item"><span class="spec-tag">TIK:</span><span id="fotopanel-thick-dup" class="tele-value">9MM</span></div>
                    <span class="info-separator">/</span>
                </div>
            </div>

            <!-- Frozen Right: Order via WhatsApp / Acquire Button -->
            <button id="btn-activate-node" title="Order via WhatsApp" onclick="acquireNodeCashflow()" class="btn-tele-glass" style="width: auto; padding: 0.5rem; flex-shrink: 0;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                    <path d="M4 16v4h16v-4" />
                    <path d="M12 7v10m0 0l-4-4m4 4l4-4" />
                </svg>
            </button>
        </div>
    </main>
 
    <!-- Bottom Action Controls (Centered) -->
    <div class="action-controls-grid">
        <!-- Scale Cycle Button -->
        <button id="btn-change-scale" title="Change Scale / Size" onclick="rotateFotoVariant('next')" class="btn-tele-glass">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-stroke">
                <rect x="5" y="5" width="14" height="14" />
            </svg>
        </button>

        <!-- Color Mode Toggle Button -->
        <button id="btn-mode-color" title="Color Mode" onclick="setFotoFilterStyle('color')" class="btn-tele-glass">
            <svg viewBox="0 0 24 24" class="icon-stroke">
                <defs>
                    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="25%" stop-color="#ff0000" />
                        <stop offset="50%" stop-color="#ff7f00" />
                        <stop offset="75%" stop-color="#0000ff" />
                        <stop offset="100%" stop-color="#8b00ff" />
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="16" height="16" fill="url(#rainbow-grad)" stroke="none" />
            </svg>
        </button>

        <!-- B&W Mode Toggle Button -->
        <button id="btn-mode-bw" title="B&W Mode" onclick="setFotoFilterStyle('bw')" class="btn-tele-glass">
            <svg viewBox="0 0 24 24" class="icon-stroke">
                <defs>
                    <linearGradient id="bw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="16" height="16" fill="url(#bw-grad)" stroke="none" />
            </svg>
        </button>

        <!-- Sepia Tone Style Button -->
        <button id="btn-mode-sepia" title="Sepia Tone Mode" onclick="setFotoFilterStyle('sepia')" class="btn-tele-glass">
            <svg viewBox="0 0 24 24" class="icon-stroke">
                <defs>
                    <linearGradient id="sepia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#704214" />
                        <stop offset="100%" stop-color="#f5e5c9" />
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="16" height="16" fill="url(#sepia-grad)" stroke="none" />
            </svg>
        </button>

        <!-- Wall Texture Backdrop Preview Button -->
        <button id="btn-toggle-wall" title="Wall Backdrop Preview" onclick="toggleWallPreview()" class="btn-tele-glass">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon-stroke">
                <path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v6M15 9v6M9 15v6" />
            </svg>
        </button>
    </div>

    <!-- Footer (Centered) -->
    <footer class="footer-container">
        <span class="footer-brand-text">
            <span>2026</span>
            <span class="footer-copy-symbol">©</span>
        </span>
    </footer>

    <!-- Core Logic Engine -->
    <script>
        /**
         * Product catalog with precise dimensions, thickness, SKU, and barcode metadata.
         */
        const ARTEPANEL_CATALOG = {
            'PULSOR': {
                defaultVariant: 'PANEL 20X20',
                variants: {
                    'PANEL 20X20': { 
                        label: '20X20CMS', 
                        spec: 'Your personalized print', 
                        media: 'ADHESIVO SOBRE MDF 9MM',
                        finish: 'Matte Lamination Inkjet',
                        price: '$20MIL', 
                        id: 'FP-20X20',
                        scale: 0.50,
                        dimensions: { width: 20, height: 20, unit: 'cm' },
                        thickness: '9MM',
                        sku: 'FP-MDF-2020',
                        barcode: '770123456781'
                    },
                    'PANEL 30X30': { 
                        label: '30X30CMS', 
                        spec: 'Your personalized print', 
                        media: 'ADHESIVO SOBRE MDF 9MM',
                        finish: 'Matte Lamination Inkjet',
                        price: '$30MIL', 
                        id: 'FP-30X30',
                        scale: 0.75,
                        dimensions: { width: 30, height: 30, unit: 'cm' },
                        thickness: '9MM',
                        sku: 'FP-MDF-3030',
                        barcode: '770123456782'
                    },
                    'PANEL 40X40': { 
                        label: '40X40CMS', 
                        spec: 'Your personalized print', 
                        media: 'ADHESIVO SOBRE MDF 9MM',
                        finish: 'Matte Lamination Inkjet',
                        price: '$40MIL', 
                        id: 'FP-40X40',
                        scale: 1.00,
                        dimensions: { width: 40, height: 40, unit: 'cm' },
                        thickness: '9MM',
                        sku: 'FP-MDF-4040',
                        barcode: '770123456783'
                    }
                }
            }
        };

        // Application State
        let currentFotoItem = 'PULSOR';
        let currentFotoVariant = 'PANEL 20X20';
        let filterStyle = 'color'; // Supported values: 'color', 'bw', 'sepia'
        let activeImageSrc = 'img/photo.png';
        let isWallPreviewActive = false;
        const targetPhoneNumber = "573128707083";

        // Element Caching System
        const cachedElements = {};
        const getCachedEl = (id) => cachedElements[id] || (cachedElements[id] = document.getElementById(id));

        /**
         * Triggers haptic vibration feedback on compatible devices.
         */
        const triggerHaptic = (pattern) => { 
            if (navigator.vibrate) navigator.vibrate(pattern); 
        };

        /**
         * Triggers click event on hidden file input element.
         */
        function triggerImageUpload() {
            const input = getCachedEl('user-image-input');
            if (input) input.click();
        }

        /**
         * Handles local image file selection and updates active image source.
         * @param {Event} event - File input change event object.
         */
        function handleUserImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                activeImageSrc = e.target.result;
                updateFotoUI();
                triggerHaptic([10, 20]);
            };
            reader.readAsDataURL(file);
        }

        /**
         * Toggles simulated wall backdrop texture in page overlay.
         */
        function toggleWallPreview() {
            isWallPreviewActive = !isWallPreviewActive;
            const overlay = getCachedEl('page-bg-overlay');
            if (overlay) {
                overlay.style.background = isWallPreviewActive 
                    ? 'repeating-linear-gradient(0deg, var(--jako-border), var(--jako-border) 1px, transparent 1px, transparent 24px)'
                    : 'radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%)';
            }
            triggerHaptic(15);
        }

        /**
         * Cycles through available product scale variants without altering color mode.
         * @param {string} direction - Direction of rotation ('next' or 'prev').
         */
        function rotateFotoVariant(direction = 'next') {
            const variants = Object.keys(ARTEPANEL_CATALOG[currentFotoItem].variants);
            let currentIndex = variants.indexOf(currentFotoVariant);
            
            currentIndex = direction === 'next' 
                ? (currentIndex + 1) % variants.length 
                : (currentIndex - 1 + variants.length) % variants.length;
            
            currentFotoVariant = variants[currentIndex];
            updateFotoUI();
            triggerHaptic(15);
        }

        /**
         * Sets color filter mode ('color', 'bw', or 'sepia').
         * @param {string} style - Target color filter mode.
         */
        function setFotoFilterStyle(style) {
            filterStyle = style;
            updateFotoUI();
            triggerHaptic(10);
        }

        /**
         * Resets state back to default 40x40 color view and resets image source.
         */
        function resetView() {
            currentFotoVariant = 'PANEL 40X40';
            filterStyle = 'color';
            activeImageSrc = 'img/photo.png';
            isWallPreviewActive = false;
            
            const input = getCachedEl('user-image-input');
            if (input) input.value = '';
            
            const overlay = getCachedEl('page-bg-overlay');
            if (overlay) {
                overlay.style.background = 'radial-gradient(circle at 50% 30%, var(--gradient-start) 0%, var(--gradient-mid) 65%, var(--gradient-end) 100%)';
            }
            
            updateFotoUI();
            triggerHaptic([10, 10]);
        }

        /**
         * Renders panel DOM structure and applies full container transformation scaling.
         * @param {Object} config - Active variant metadata and scale factors.
         */
        function renderPanelImages(config) {
            const container = getCachedEl('fotopanel-pack-container');
            if (!container) return;

            container.style.transform = `scale(${config.scale})`;

            let viewport = container.querySelector('.pack-viewport');
            if (!viewport) {
                viewport = document.createElement('div');
                viewport.className = 'pack-viewport';
                container.appendChild(viewport);
            }

            let filterClass = '';
            if (filterStyle === 'bw') filterClass = 'grayscale-filter';
            if (filterStyle === 'sepia') filterClass = 'sepia-filter';

            viewport.innerHTML = `
                <div style="position: absolute; inset: 0; background-color: #e5e5e5; z-index: 1;"></div>
                <img src="${activeImageSrc}" alt="Panel Surface" class="img-glow-transition ${filterClass}" style="z-index: 10;" />
            `;
        }

        /**
         * Synchronizes UI elements (specs, price, and visualizer scale).
         */
        function updateFotoUI() {
            const config = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const dimsText = `${config.dimensions.width}X${config.dimensions.height}${config.dimensions.unit.toUpperCase()}`;
            
            // Helper to batch update main and duplicated ticker elements
            const setSpecText = (id, text) => {
                const el = getCachedEl(id);
                const dupEl = getCachedEl(`${id}-dup`);
                if (el) el.textContent = text;
                if (dupEl) dupEl.textContent = text;
            };

            setSpecText('fotopanel-price', config.price);
            setSpecText('fotopanel-dims', dimsText);
            setSpecText('fotopanel-thick', config.thickness);

            renderPanelImages(config);
        }

        /**
         * Generates order message payload and initiates WhatsApp checkout redirect.
         */
        function acquireNodeCashflow() {
            const variant = ARTEPANEL_CATALOG[currentFotoItem].variants[currentFotoVariant];
            const dimsText = `${variant.dimensions.width}x${variant.dimensions.height}${variant.dimensions.unit}`;
            const message = [
                `ORDER: ${variant.label}`,
                `VARIANT: ${currentFotoVariant}`,
                `SPEC: ${variant.spec}`,
                `MEDIA: ${variant.media}`,
                `DIMS: ${dimsText}`,
                `THICKNESS: ${variant.thickness}`,
                `SKU: ${variant.sku}`,
                `BARCODE: ${variant.barcode}`,
                `STYLE: ${filterStyle.toUpperCase()}`,
                `PRICE: ${variant.price}`
            ].join('\n');

            triggerHaptic([15, 40, 15]);
            window.open(`https://api.whatsapp.com/send?phone=${targetPhoneNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        // Initialize stage on DOM load
        document.addEventListener('DOMContentLoaded', updateFotoUI);
    </script>
