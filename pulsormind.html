<head>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================================
           1. CORE DESIGN SYSTEM & NATIVE CSS VARIABLES
           ========================================================================= */
        :root {
            --bg-base: #020617;
            --jako-black: #0a0705;
            --sky-glow: rgba(14, 165, 233, 0.1);
            --sky-border: rgba(14, 165, 233, 0.3);
            --sky-accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.6);
            --font-tech: 'Orbitron', monospace, sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        /* Reset & Base Layout */
        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: var(--font-tech); 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            -webkit-font-smoothing: antialiased;
        } 

        ::selection {
            background-color: #ffffff;
            color: #000000;
        }

        /* Ambient Radial & Linear Overlays */
        #page-bg-overlay {
            position: fixed; 
            inset: 0; 
            z-index: -1;
            background: radial-gradient(circle at 50% 49%, #1e3a8a 0%, #0f172a 50%, #020617 100%);
        }

        .ambient-gradient {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent, rgba(0,0,0,0.4));
            z-index: 0;
            pointer-events: none;
        }

        /* Transition Utilities */
        .img-glow-transition { 
            transition: opacity 0.5s ease-in-out; 
        }

        /* Header Control Bar */
        .header-container {
            width: 100%;
            flex-shrink: 0;
            z-index: 50;
            background-color: rgba(8, 47, 73, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px var(--sky-glow);
            display: flex;
            flex-direction: column;
        }

        .top-control-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
            padding: 0 1rem;
            height: 3rem;
        }

        .btn-tele-glass {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-tele-glass:hover {
            background-color: var(--sky-glow);
        }

        .btn-tele-glass:active {
            transform: scale(0.95);
        }

        .tele-btn-left {
            height: 100%;
            padding-left: 0.5rem;
            padding-right: 0.25rem;
            gap: 0.375rem;
            justify-content: flex-start;
        }

        .tele-btn-center {
            width: 3rem;
            height: 3rem;
            flex-shrink: 0;
            justify-content: center;
            border-left: 1px solid var(--sky-border);
            border-right: 1px solid var(--sky-border);
        }

        .tele-btn-right {
            height: 100%;
            padding-right: 0.5rem;
            padding-left: 0.25rem;
            gap: 0.375rem;
            justify-content: flex-end;
        }

        .tele-num-val {
            font-family: var(--font-tech);
            color: #ffffff;
            letter-spacing: 0.1em;
            font-size: 10px;
            transition: color 0.3s ease;
        }

        .btn-tele-glass:hover .tele-num-val {
            color: var(--sky-accent);
        }

        .tele-unit-label {
            font-size: 9px;
            letter-spacing: 0.15em;
            color: #38bdf8;
            font-weight: 700;
            text-transform: uppercase;
        }

        .icon-tele {
            width: 1rem;
            height: 1rem;
            fill: #ffffff;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .btn-tele-glass:hover .icon-tele {
            fill: var(--sky-accent);
        }

        .sub-header-bar {
            width: 100%;
            border-top: 1px solid var(--sky-border);
            padding: 0.375rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .telemetry-readout-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 8px;
            letter-spacing: 0.25em;
            font-family: var(--font-tech);
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        /* Central Visualizer Layer */
        .main-visualizer-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
        }

        #fotopanel-pack-container {
            position: relative;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            margin: 0 auto;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.9));
        }

        .pack-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #fotopanel-pack-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .vector-overlay-layer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            z-index: 20;
            pointer-events: none;
        }

        .svg-target-reticle {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 1;
            transition: all 0.5s ease;
            transform-origin: center;
            transform: scale(1.2);
        }

        .svg-text-title {
            fill: #ffffff;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        .svg-text-desc {
            fill: var(--text-muted);
            font-size: 9px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        /* Footer */
        .footer-container {
            height: 50px;
            width: 100%;
            flex-shrink: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.3), transparent);
            backdrop-filter: blur(4px);
            z-index: 50;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-brand-text {
            font-size: 6px;
            letter-spacing: 0.35em;
            font-family: var(--font-tech);
            font-weight: 700;
            color: rgba(186, 230, 253, 0.4);
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .footer-container:hover .footer-brand-text {
            color: rgba(125, 211, 252, 0.8);
        }

        /* Quantum Wave Helpers */
        .rotate-neg-90 {
            transform: rotate(-90deg);
            transform-origin: 200px 200px;
        }
    </style>
</head>

                    },
                    'PANEL_40X40': {

                        price: '$55USD', 
                        id: 'FP-40X40',
                        imgBack: 'img/panel40W.png', 
                        imgRaw: 'img/panel40B.png',
                        telemetry: { DIM: '40x40', DIAL: '⧗1100', RATE: '$0.05USD' }
                    }
                }
            }
        };

        // Application State
        let currentFotoItem = 'PULSOR';
        let currentFotoMindset = 'MINDSET_01';
        let currentFotoVariant = 'PANEL_40X40';
        let currentLang = 'eng';

        const targetPhoneNumber = "573128707083";
        let currentSphereIdx = "0000";
        let activeNodeVal = "0000";
        let biokineticWaveHistory = [];
        let waveDisplayState = 0; 
        let inspectModeIndex = 0; 

        // Element Caching Engine
        const $ = (id) => document.getElementById(id);
        const cachedElements = {};
        
        function getCachedEl(id) {
            if (!cachedElements[id]) {
                cachedElements[id] = $(id);
            }
            return cachedElements[id];
        }

        const triggerHaptic = (ms) => { 
            if (navigator.vibrate) navigator.vibrate(ms); 
        };

        const VECTOR_TO_CLOCK_INDEX = {
            'P': 1,  'U': 2,  'L': 3,  'S': 4,
            'PL': 5, 'PU': 6, 'LU': 7, 'SU': 8,
            'PUL': 9,'LPS': 10,'SPU': 11,'ULS': 12
        };

        /**
         * Resolves dynamic image path based on Mindset, Variant Media Type, and Active Language
         */
        function resolveAssetPath(mindsetKey, variantKey, lang = 'eng') {
            const catalog = ARTEPANEL_CATALOG[currentFotoItem];
            const mindset = catalog.mindsets[mindsetKey];
            const variant = catalog.variants[variantKey];
            
            if (!mindset || !variant) return 'img/surface.png';
            
            const mediaGroup = mindset.assets[variant.mediaType];
            return mediaGroup ? (mediaGroup[lang] || 'img/surface.png') : 'img/surface.png';
        }

        /**
         * Visual Inspector Switcher (Front, Back, Raw)
         */
        function applyVisualMode(mode) {
            const front = getCachedEl('fotopanel-pack-img');
            const back = getCachedEl('fotopanel-pack-img-back');
            const raw = getCachedEl('fotopanel-pack-img-raw');
            const svg = getCachedEl('laser-vector-target');

            [front, back, raw].forEach(el => { if(el) el.style.opacity = '0'; });
            
            if (mode === 'front') {
                inspectModeIndex = 0;
                front.style.opacity = '1';
                front.style.zIndex = '10';
                back.style.zIndex = '0';
                if (svg) { 
                    svg.style.opacity = '1'; 
                    svg.style.pointerEvents = 'auto'; 
                }
            } else if (mode === 'back') {
                inspectModeIndex = 1;
                back.style.opacity = '1';
                back.style.zIndex = '10';
                front.style.zIndex = '0';
                if (svg) { 
                    svg.style.opacity = '0'; 
                    svg.style.pointerEvents = 'none'; 
                }
            } else if (mode === 'raw') {
                inspectModeIndex = 2;
                raw.style.opacity = '1';
                if (svg) { 
                    svg.style.opacity = '0'; 
                    svg.style.pointerEvents = 'none'; 
                }
            }
        }

        /**
         * Rotate Active Product Variant
         */
        function rotateFotoVariant(direction = 'next') {
            const itemConfig = ARTEPANEL_CATALOG[currentFotoItem];
            const variantsKeys = Object.keys(itemConfig.variants);
            const currentIndex = variantsKeys.indexOf(currentFotoVariant);
            
            let nextIndex = (direction === 'next') 
                ? (currentIndex + 1) % variantsKeys.length 
                : (currentIndex - 1 + variantsKeys.length) % variantsKeys.length;
            
            currentFotoVariant = variantsKeys[nextIndex];
            updateFotoUI();
            triggerHaptic(12);
        }

        /**
         * Update Visual UI Elements from Catalog Matrix
         */
        function updateFotoUI() {
            const itemConfig = ARTEPANEL_CATALOG[currentFotoItem];
            const variantConfig = itemConfig.variants[currentFotoVariant];
            
            const descEl = getCachedEl('fotopanel-description');
            const packImg = getCachedEl('fotopanel-pack-img');
            const packImgBack = getCachedEl('fotopanel-pack-img-back');
            const packImgRaw = getCachedEl('fotopanel-pack-img-raw');
            const labelTitle = getCachedEl('laser-variant-title');
            
            if (descEl && packImg && packImgBack) {
                descEl.style.opacity = '0';
                
                setTimeout(() => {
                    descEl.textContent = variantConfig.desc;
                    packImg.src = resolveAssetPath(currentFotoMindset, currentFotoVariant, currentLang);
                    packImgBack.src = variantConfig.imgBack;
                    if (packImgRaw) packImgRaw.src = variantConfig.imgRaw;
                    
                    if (labelTitle) labelTitle.textContent = variantConfig.label;

                    descEl.style.opacity = '1';
                }, 120);
            }
        }

        /**
         * Compute Sphere Epoch Index
         */
        function calculateSphereIndex() {
            const now = new Date();
            const epoch = new Date('2012-12-21T00:00:00Z');
            const daysSinceEpoch = Math.floor((now - epoch) / 86400000);
            const currentHour = now.getHours();
            const sphereQuadrant = Math.floor(currentHour / 6);
            return `${String((daysSinceEpoch * 4) + sphereQuadrant).padStart(4, '0')}`;
        }

        /**
         * Main PULS Telemetry Engine Loop
         */
        function updateZ() {
            let biokineticCoordinate = "";
            const now = new Date();
            const hours = now.getHours(); 
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            currentSphereIdx = calculateSphereIndex();

            let setsStage = 1;  
            let repsStage = 1;  
            let currentAction = 'P'; 

            if (seconds % 2 !== 0) {
                const progress1s = now.getMilliseconds() / 1000; 
                setsStage = Math.floor(progress1s * 12) + 1;
                repsStage = 13 - setsStage; 

                if (progress1s < 0.25) currentAction = 'P';
                else if (progress1s < 0.5) currentAction = 'U';
                else if (progress1s < 0.75) currentAction = 'L';
                else currentAction = 'S';
            } else {
                setsStage = Math.floor((minutes % 12) + 1);
                
                if (seconds < 30) {
                    const subSlot = Math.floor((seconds % 30) / 7.5);
                    currentAction = ["PL", "PU", "LU", "SU"][subSlot] || "PL";
                    repsStage = Math.floor((seconds % 10) + 2);
                } else {
                    const subSlot = Math.floor(((seconds - 30) % 30) / 7.5);
                    currentAction = ["PUL", "LPS", "SPU", "ULS"][subSlot] || "ULS";
                    repsStage = Math.floor(((seconds - 30) % 10) + 3);
                }
            }

            setsStage = Math.max(1, Math.min(12, setsStage));
            repsStage = Math.max(1, Math.min(12, repsStage));
            biokineticCoordinate = `${setsStage}${currentAction}${repsStage}`;

            const vectorIndex = VECTOR_TO_CLOCK_INDEX[currentAction] || 1;

            biokineticWaveHistory.unshift({
                sets: setsStage,
                vector: vectorIndex,
                reps: repsStage
            });
            if (biokineticWaveHistory.length > 12) biokineticWaveHistory.pop();

            renderBiokineticWaves();

            const elDialPack = getCachedEl('z-dial-pack');
            const elDialTele = getCachedEl('z-dial-telemetry');

            if (elDialPack) elDialPack.textContent = biokineticCoordinate;
            if (elDialTele) elDialTele.textContent = biokineticCoordinate;
                    
            const totalSecondsSinceMidnight = (hours * 3600) + (minutes * 60) + seconds;
            activeNodeVal = `${String(totalSecondsSinceMidnight + 1).padStart(4, '0')}`;

            const subSetsSolar = getCachedEl('sub-sets-solar');
            const subRepsTension = getCachedEl('sub-reps-tension');
            if (subSetsSolar) subSetsSolar.textContent = `${(0.05 + (setsStage / 240)).toFixed(3)}`;
            if (subRepsTension) subRepsTension.textContent = `${(14.2 + (repsStage * 0.8)).toFixed(1)}`;

            if (window.activeTelemetryBtnId && TELEMETRY_CONFIG[window.activeTelemetryBtnId]) {
                const telemetryData = getCachedEl('panel-telemetry-data');
                
                if (telemetryData) {
                    if (window.activeTelemetryBtnId === 'btn-tele-dial') {
                        if (waveDisplayState === 0) {
                            telemetryData.innerHTML = biokineticCoordinate;
                        } else {
                            const meaningConfig = TELEMETRY_CONFIG['btn-tele-dial'].meaning;
                            const evaluatedMeaning = typeof meaningConfig === 'function' ? meaningConfig() : meaningConfig;
                            telemetryData.innerHTML = evaluatedMeaning.toUpperCase();
                        }
                    } else {
                        const meaningConfig = TELEMETRY_CONFIG[window.activeTelemetryBtnId].meaning;
                        const evaluatedMeaning = typeof meaningConfig === 'function' ? meaningConfig() : meaningConfig;
                        telemetryData.innerHTML = evaluatedMeaning.toUpperCase();
                    }
                }
            }
        }

        const TELEMETRY_CONFIG = {
            'btn-tele-hz': {
                meaning: "RESONANT FREQUENCY",
                targetElId: 'sub-sets-solar'
            },
            'btn-tele-dial': {
                meaning: () => {
                    const coord = getCachedEl('z-dial-telemetry')?.textContent || "1P1";
                    const match = coord.match(/^(\d+)([A-Z]+)(\d+)$/);
                    if (!match) return "ACTIVE BIOKINETIC MATRIX.";
                    
                    const [_, sets, action, reps] = match;
                    
                    const pulsMeanings = {
                        'P':   'PACE',
                        'U':   'PUSH',
                        'L':   'PULL',
                        'S':   'SURGE',
                        'PL':  'PACE WITH PULL',
                        'PU':  'PACE WITH PUSH',
                        'LU':  'PULL WITH PUSH',
                        'SU':  'SURGE WITH PUSH',
                        'PUL': 'PACE WITH PUSH AND PULL',
                        'LPS': 'PULL WITH PACE AND SURGE',
                        'SPU': 'SURGE WITH PACE AND PUSH',
                        'ULS': 'PUSH WITH PULL AND SURGE'
                    };

                    const actionLabel = pulsMeanings[action] || "REGENERATIVE BIOKINETIC WAVES";
                    return `${sets} SETS ${actionLabel} ${reps} REPS`;
                },
                targetElId: null
            },
            'btn-tele-tension': {
                meaning: "GRAVITATIONAL MAGNETISM",
                targetElId: 'sub-reps-tension'
            }
        };

        /**
         * Render Biokinetic Wave Vector Layers into SVG Container
         */
        function renderBiokineticWaves() {
            const container = $('wave-quantum-container');
            if (!container) return;

            if (waveDisplayState === 1) {
                container.innerHTML = '';
                return;
            }

            if (biokineticWaveHistory.length === 0) return;

            let htmlContent = '';
            biokineticWaveHistory.forEach((dial, tIndex) => {
                const currentScale = (tIndex + 5) * 0.85;
                const baseOpacity = 1.0 - (tIndex * 0.12);
                if (baseOpacity <= 0) return;

                const viewFactor = 8.5; 
                const layers = [
                    { id: 'internal',     r: (currentScale * 1.0) * viewFactor, opacity: baseOpacity * 0.80, value: dial.sets },
                    { id: 'intermediate', r: (currentScale * 1.4) * viewFactor, opacity: baseOpacity * 0.60, value: dial.vector },
                    { id: 'external',     r: (currentScale * 1.8) * viewFactor, opacity: baseOpacity * 0.40, value: dial.reps }
                ];

                layers.forEach(layer => {
                    if (layer.r <= 0) return;
                    const circumference = 2 * Math.PI * layer.r;
                    const angle = (layer.value - 1) * 30; 
                    const arcLength = (layer.value / 12) * circumference;
                    const dashArray = `${arcLength} ${circumference}`;

                    htmlContent += `
                        <circle 
                            cx="200" 
                            cy="200" 
                            r="${layer.r}" 
                            transform="rotate(${angle} 200 200)"
                            style="stroke: #ffffff; transition: all 0.3s ease; stroke-width: ${tIndex === 0 ? 1.5 : 1.0}; stroke-opacity: ${layer.opacity}; stroke-dasharray: ${dashArray}; stroke-linecap: round; fill: none;"
                        />`;
                });
            });
            container.innerHTML = htmlContent;
        }

        /**
         * Enable Telemetry Interactive Triggers
         */
        function enableTelemetryReveal() {
            const telemetryData = getCachedEl('panel-telemetry-data');
            const sandwatchGroup = getCachedEl('sandwatch-group');
            let lastActiveData = null;

            Object.keys(TELEMETRY_CONFIG).forEach(btnId => {
                const btn = getCachedEl(btnId);
                if (!btn || btn.dataset.bound) return;
                btn.dataset.bound = "true";

                btn.addEventListener('click', () => {
                    triggerHaptic(12);

                    if (btnId === 'btn-tele-dial') {
                        if (inspectModeIndex !== 0) {
                            applyVisualMode('front');
                        }

                        if (window.activeTelemetryBtnId === 'btn-tele-dial') {
                            waveDisplayState = (waveDisplayState === 0) ? 1 : 0;
                        } else {
                            waveDisplayState = 0;
                        }

                        if (sandwatchGroup) {
                            sandwatchGroup.style.display = (waveDisplayState === 1) ? 'block' : 'none';
                        }
                        renderBiokineticWaves();
                    } else {
                        inspectModeIndex = 0; 
                        applyVisualMode('front');
                    }

                    if (lastActiveData) {
                        lastActiveData.classList.remove('is-active');
                    }

                    const targetDataEl = TELEMETRY_CONFIG[btnId].targetElId ? getCachedEl(TELEMETRY_CONFIG[btnId].targetElId) : null;
                    if (targetDataEl) {
                        targetDataEl.classList.add('is-active');
                        lastActiveData = targetDataEl;
                    }

                    window.activeTelemetryBtnId = btnId;

                    let evaluatedMeaning = "";
                    if (btnId === 'btn-tele-dial') {
                        if (waveDisplayState === 0) {
                            evaluatedMeaning = getCachedEl('z-dial-telemetry')?.textContent || "8UST11";
                        } else {
                            const meaningConfig = TELEMETRY_CONFIG[btnId].meaning;
                            evaluatedMeaning = typeof meaningConfig === 'function' ? meaningConfig() : meaningConfig;
                        }
                    } else {
                        const meaningConfig = TELEMETRY_CONFIG[btnId].meaning;
                        evaluatedMeaning = typeof meaningConfig === 'function' ? meaningConfig() : meaningConfig;
                    }
                    
                    telemetryData.innerHTML = evaluatedMeaning.toUpperCase();
                });
            });
        }

        /**
         * Direct Cashflow WhatsApp Node Dispatcher
         */
        function acquireNodeCashflow() {
            const catalog = ARTEPANEL_CATALOG[currentFotoItem];
            const variantConfig = catalog.variants[currentFotoVariant];
            const mindsetConfig = catalog.mindsets[currentFotoMindset];
            
            const currentCoord = getCachedEl('z-dial-telemetry')?.textContent || getCachedEl('z-dial-pack')?.textContent || "N/A";
            const currentSphere = currentSphereIdx;
            const currentNode = activeNodeVal;
            const freqValue = getCachedEl('sub-sets-solar')?.textContent || "0.00 Hz";
            const tensionValue = getCachedEl('sub-reps-tension')?.textContent || "0.0 N";

            const message = [
                `ORDER: ${variantConfig.label}`,
                `ENFOQUE: ${mindsetConfig.enfoque} (${mindsetConfig.autor})`,
                `FRASE: "${mindsetConfig.phrases[currentLang]}"`,
                `VARIANTE: ${currentFotoVariant}`,
                `SPEC: ${variantConfig.spec}`,
                `MEDIA: ${variantConfig.media}`,
                `FINISH: ${variantConfig.finish}`,
                `ID: ${variantConfig.id}`,
                `PRICE: ${variantConfig.price}`,
                `DIAL: ${currentCoord}`,
                `CYCLE: ${currentSphere}`,
                `SATURATION: ${currentNode}`,
                `RESONANCE: ${freqValue}`,
                `TENSION: ${tensionValue}`
            ].join('\n');

            triggerHaptic([15, 40, 15]);
            window.open(`https://api.whatsapp.com/send?phone=${targetPhoneNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        // DOM Ready Execution
        document.addEventListener('DOMContentLoaded', () => {
            updateFotoUI();
            updateZ(); 
            setInterval(updateZ, 1000);
            enableTelemetryReveal();
        });
    </script>
